[package]
name = "fcp-sbc"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SBC (Session Border Controller) binary for the Ferrous Communications Platform"

[[bin]]
name = "fcp-sbc"
path = "src/main.rs"

[features]
default = ["tls", "storage-redis"]
tls = ["fcp-sip/tls"]
storage-redis = ["dep:fcp-storage-redis", "dep:fcp-cluster"]

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-sip = { path = "../fcp-sip", features = ["ws"] }
fcp-sbc-core = { path = "../fcp-sbc-core" }
fcp-b2bua-core = { path = "../fcp-b2bua-core" }
fcp-cdr = { path = "../fcp-cdr" }
fcp-events = { path = "../fcp-events" }
fcp-media = { path = "../fcp-media" }
fcp-storage-postgres = { path = "../fcp-storage-postgres" }

# SIP stack from siphon-rs
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-parse = { path = "../../external/siphon-rs/crates/sip-parse" }
sip-transport = { path = "../../external/siphon-rs/crates/sip-transport" }
sip-transaction = { path = "../../external/siphon-rs/crates/sip-transaction" }
sip-dialog = { path = "../../external/siphon-rs/crates/sip-dialog" }
sip-auth = { path = "../../external/siphon-rs/crates/sip-auth" }
sip-registrar = { path = "../../external/siphon-rs/crates/sip-registrar" }
sip-uac = { path = "../../external/siphon-rs/crates/sip-uac" }
sip-uas = { path = "../../external/siphon-rs/crates/sip-uas" }
sip-ratelimit = { path = "../../external/siphon-rs/crates/sip-ratelimit" }
sip-sdp = { path = "../../external/siphon-rs/crates/sip-sdp" }
sip-observe = { path = "../../external/siphon-rs/crates/sip-observe" }
sip-dns = { path = "../../external/siphon-rs/crates/sip-dns" }

# HTTP API
axum = "0.7"

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# STIR/SHAKEN (certificate fetching and key parsing)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
x509-parser = "0.16"
base64 = "0.22"

# Utilities
async-trait = "0.1"
bytes = { workspace = true }
dashmap = "6"
socket2 = "0.5"
ipnetwork = "0.20"
rand = "0.8"
regex = "1"
uuid = { workspace = true }

# Optional cluster dependencies
fcp-storage-redis = { path = "../fcp-storage-redis", optional = true }
fcp-cluster = { path = "../fcp-cluster", optional = true }

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
tower = "0.5"
