[package]
name = "fcp-cdr"
version.workspace = true
edition = "2021"
description = "The CDR pipeline: the record a node builds at hangup, the local spool it goes to, and the processor that stores it"

[dependencies]
fcp-core = { path = "../fcp-core" }
fcp-billing = { path = "../fcp-billing" }
fcp-events = { path = "../fcp-events" }
sip-sdp = { path = "../../external/siphon-rs/crates/sip-sdp" }

anyhow.workspace = true
async-trait = "0.1"
bytes.workspace = true
chrono = "0.4"
# The archive (docs/CDR_PIPELINE.md §13, phase 5): gzipped JSON Lines to a
# directory or an S3-compatible bucket, signed with SigV4.
base64 = "0.22"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
# S3 asks a legal hold request for its Content-MD5.
md-5 = "0.10"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rust_decimal_macros.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
