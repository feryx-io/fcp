[package]
name = "fcp-media"
version = "0.5.0"
edition = "2021"
authors = ["FCP Contributors"]
description = "Media integration layer for FCP - bridges SIP signaling with forge-media engine"

[features]
default = ["embedded", "g722", "opus"]
# Embedded mode: forge-media runs in-process (Phase 1)
embedded = []
# Remote mode: forge-media runs as separate service (Future)
remote = []
# Enable both modes
full = ["embedded", "remote"]
# Audio codec features
g722 = ["forge-codecs/g722"]
# Opus is on by default (softphones and browsers offer it first). It pulls in
# `audiopus`, which builds libopus from source with cmake.
opus = ["forge-codecs/opus", "forge-engine/opus"]

[dependencies]
# Internal FCP dependencies
fcp-core = { path = "../fcp-core" }

# forge-media as library (for embedded mode)
forge-core = { path = "../../external/forge-media/crates/forge-core", optional = false }
forge-engine = { path = "../../external/forge-media/crates/forge-engine", optional = false }
forge-rtp = { path = "../../external/forge-media/crates/forge-rtp", optional = false }
forge-codecs = { path = "../../external/forge-media/crates/forge-codecs", optional = false }
forge-transcoder = { path = "../../external/forge-media/crates/forge-transcoder", optional = false }
forge-recorder = { path = "../../external/forge-media/crates/forge-recorder", optional = false }
forge-injection = { path = "../../external/forge-media/crates/forge-injection", optional = false }
# Speech recognition: recordings resampled to 16 kHz
forge-resampler = { path = "../../external/forge-media/crates/forge-resampler" }
# Video SDP helpers (answer_video, reject_section, codec choice, feedback attributes)
forge-sdp = { path = "../../external/forge-media/crates/forge-sdp" }

# SIP dependencies (for SDP handling)
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-sdp = { path = "../../external/siphon-rs/crates/sip-sdp" }
sip-dialog = { path = "../../external/siphon-rs/crates/sip-dialog" }

# HTTP client (for remote mode and TTS providers)
reqwest = { version = "0.12", features = ["json", "multipart"] }
# Streaming speech recognition (Deepgram, the remote server)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_urlencoded = "0.7"
# WAV recordings read for transcription
hound = "3"

# Async runtime
tokio = { workspace = true }
async-trait = "0.1"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Concurrent collections
dashmap = "6"
parking_lot = "0.12"

# Time
chrono = "0.4"

# UUIDs
uuid = { workspace = true }

# Cryptography (for TTS cache keys and SRTP key generation)
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3"
toml = "0.8"
axum = { version = "0.7", features = ["ws", "multipart"] }
