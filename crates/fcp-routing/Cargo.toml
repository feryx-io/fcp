[package]
name = "fcp-routing"
version = "0.3.0"
edition = "2021"
authors = ["FCP Contributors"]
description = "Declarative policy-based call routing for FCP (policy engine lives in fcp-policy)"

[dependencies]
# Internal dependencies
fcp-core = { path = "../fcp-core" }
fcp-policy = { path = "../fcp-policy" }

# Error handling
anyhow = "1.0"
async-trait = "0.1"
serde_json = { workspace = true }

# Async
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
