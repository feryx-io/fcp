[package]
name = "fcp-conference-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standalone conference bridge server for the Ferrous Communications Platform"

[features]
default = ["tls", "storage-redis"]
tls = ["fcp-sip/tls"]
storage-redis = ["dep:fcp-storage-redis", "dep:fcp-cluster"]
# Native video codec bindings (see docs/VIDEO_CONFERENCING.md §6). Without
# them the server has only the raw test codec and offers callers no video
# unless `conference.video_native_codecs_only = false`.
video-vpx = ["forge-video-codecs/vpx"]
video-openh264 = ["forge-video-codecs/openh264"]
video-dav1d = ["forge-video-codecs/dav1d"]
video-svt-av1 = ["forge-video-codecs/svt-av1"]
video-all = ["video-vpx", "video-openh264", "video-dav1d", "video-svt-av1"]
# A GPU (docs/GPU.md, design §15.7): FFmpeg's device contexts through
# forge-video-hw — NVDEC decoders, NVENC encoders, a compositor on the
# device — for the node named by `conference.video_device`. Needs the
# FFmpeg development headers at build time and the driver at run time;
# not in `video-all`, which is the host's native bindings.
video-hwaccel = ["forge-video-codecs/hwaccel", "dep:forge-video-hw"]
# Record a room's composite video and mixed audio to one WebM file
# (docs/VIDEO_CONFERENCING.md §11). Off by default, like the codec
# features: Opus pulls in `audiopus`, which builds libopus from source.
# Without it every recording is the audio-only WAV it always was, and
# `conference.recording_format` says so at startup.
recording-webm = ["dep:forge-webm", "forge-codecs/opus"]
# Record to fragmented MP4 instead — H.264, HEVC or AV1 with Opus (design
# §15.9): what a GPU node records on NVENC, and the container every player
# opens. Same Opus dependency as WebM's.
recording-mp4 = ["dep:forge-mp4", "forge-codecs/opus"]
# Push a live webinar to an RTMP service (docs/WEBINARS.md W7): H.264 and
# AAC in FLV over rtmp:// or rtmps://. AAC is the Fraunhofer FDK library
# built from source (forge-codecs `aac`), whose licence grants no patent
# rights: AAC's are the deployer's matter. Off by default.
rtmp = ["recording-mp4", "dep:forge-rtmp", "forge-codecs/aac"]

[[bin]]
name = "fcp-conference"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-cdr = { path = "../fcp-cdr" }
fcp-sip = { path = "../fcp-sip", features = ["ws"] }
fcp-api-core = { path = "../fcp-api-core" }
fcp-sbc-core = { path = "../fcp-sbc-core" }
fcp-b2bua-core = { path = "../fcp-b2bua-core" }
fcp-media = { path = "../fcp-media" }
fcp-events = { path = "../fcp-events" }

# Storage backend
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
fcp-storage-redis = { path = "../fcp-storage-redis", features = ["cdr"], optional = true }
fcp-cluster = { path = "../fcp-cluster", optional = true }

# forge-media crates (conference engine)
forge-conference = { path = "../../external/forge-media/crates/forge-conference" }
forge-bfcp = { path = "../../external/forge-media/crates/forge-bfcp" }
forge-engine = { path = "../../external/forge-media/crates/forge-engine" }
forge-mixer = { path = "../../external/forge-media/crates/forge-mixer" }
forge-core = { path = "../../external/forge-media/crates/forge-core" }
forge-rtp = { path = "../../external/forge-media/crates/forge-rtp" }
forge-codecs = { path = "../../external/forge-media/crates/forge-codecs" }
forge-dtmf = { path = "../../external/forge-media/crates/forge-dtmf" }
forge-resampler = { path = "../../external/forge-media/crates/forge-resampler" }
forge-video = { path = "../../external/forge-media/crates/forge-video" }
forge-video-codecs = { path = "../../external/forge-media/crates/forge-video-codecs" }
forge-video-hw = { path = "../../external/forge-media/crates/forge-video-hw", optional = true }
forge-webm = { path = "../../external/forge-media/crates/forge-webm", optional = true }
forge-mp4 = { path = "../../external/forge-media/crates/forge-mp4", optional = true }
forge-rtmp = { path = "../../external/forge-media/crates/forge-rtmp", optional = true }

# SIP stack from siphon-rs
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-transport = { path = "../../external/siphon-rs/crates/sip-transport" }
sip-transaction = { path = "../../external/siphon-rs/crates/sip-transaction" }
sip-dialog = { path = "../../external/siphon-rs/crates/sip-dialog" }
sip-dns = { path = "../../external/siphon-rs/crates/sip-dns" }
sip-uac = { path = "../../external/siphon-rs/crates/sip-uac" }
sip-observe = { path = "../../external/siphon-rs/crates/sip-observe" }
sip-sdp = { path = "../../external/siphon-rs/crates/sip-sdp" }
sip-uas = { path = "../../external/siphon-rs/crates/sip-uas" }
sip-parse = { path = "../../external/siphon-rs/crates/sip-parse" }

# HTTP API
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
hound = "3"
chrono = "0.4"

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
async-trait = "0.1"
bytes = { workspace = true }
dashmap = "6"
parking_lot = "0.12"
socket2 = "0.5"
rand = "0.8"
uuid = { workspace = true }

# HTTP client for event forwarding
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Streaming responses
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures = "0.3"
async-stream = "0.3"

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
tempfile = "3"
