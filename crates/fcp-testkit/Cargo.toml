[package]
name = "fcp-testkit"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Test-support helpers for FCP: binary smoke tests, throwaway databases, the scripted SIP phone"
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
bytes = { workspace = true }
dashmap = "6"
libc = "0.2"
serde_json = { workspace = true }
serde_yaml = "0.9"
redis = { version = "0.27", features = ["tokio-comp"] }
smol_str = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tempfile = "3"
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rcgen = "0.13"
base64 = "0.22"
# The stand-in identity provider signs ID tokens RS256.
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
# The stand-in Yealink RPS checks requests signed HMAC-SHA256 over a body MD5.
hmac = "0.12"
md5 = "0.7"
# HTTPS in the HTTP helpers and the phone over SIPS, with a CA of the test's.
tokio-rustls = "0.26"
rustls-pemfile = "2"

# The seed writes fixtures the way the binaries read them.
fcp-core = { path = "../fcp-core" }
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
# The scripted recognizer speaks fcp-media's STT protocol with its types.
fcp-media = { path = "../fcp-media" }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"

# The phone: siphon-rs for SIP, forge-media for RTP and codecs.
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-parse = { path = "../../external/siphon-rs/crates/sip-parse" }
sip-transaction = { path = "../../external/siphon-rs/crates/sip-transaction" }
sip-transport = { path = "../../external/siphon-rs/crates/sip-transport", features = ["tls"] }
sip-dialog = { path = "../../external/siphon-rs/crates/sip-dialog" }
sip-uac = { path = "../../external/siphon-rs/crates/sip-uac" }
sip-uas = { path = "../../external/siphon-rs/crates/sip-uas" }
sip-dns = { path = "../../external/siphon-rs/crates/sip-dns" }
sip-sdp = { path = "../../external/siphon-rs/crates/sip-sdp" }
forge-rtp = { path = "../../external/forge-media/crates/forge-rtp" }
forge-codecs = { path = "../../external/forge-media/crates/forge-codecs" }
forge-dtmf = { path = "../../external/forge-media/crates/forge-dtmf" }
