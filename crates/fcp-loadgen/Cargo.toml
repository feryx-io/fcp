[package]
name = "fcp-loadgen"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Load harness for FCP: many scripted SIP phones against a running node, and what it costs the node"
# A measuring tool, not part of any release image
# (`docs/CAPACITY_AND_SURVIVABILITY.md` §8).
publish = false

[[bin]]
name = "fcp-loadgen"
path = "src/main.rs"

[dependencies]
fcp-testkit = { path = "../fcp-testkit" }

anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
