[package]
name = "fcp-admin"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FCP Admin API binary - management and administration endpoints"

[features]
default = ["storage-sqlite"]
storage-sqlite = ["fcp-storage-sqlite"]
storage-postgres = ["fcp-storage-postgres"]
storage-mysql = ["fcp-storage-mysql"]
storage-mongodb = ["fcp-storage-mongodb"]
storage-all = ["storage-sqlite", "storage-postgres", "storage-mysql", "storage-mongodb"]

[[bin]]
name = "fcp-admin"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-api-core = { path = "../fcp-api-core" }
fcp-runtime = { path = "../fcp-runtime" }
fcp-events = { path = "../fcp-events" }

# Storage backends (optional)
fcp-storage-sqlite = { path = "../fcp-storage-sqlite", optional = true }
fcp-storage-postgres = { path = "../fcp-storage-postgres", optional = true }
fcp-storage-mysql = { path = "../fcp-storage-mysql", optional = true }
fcp-storage-mongodb = { path = "../fcp-storage-mongodb", optional = true }

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { workspace = true }
uuid = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# For future connection pooling
dashmap = "6"
