[package]
name = "fcp-admin"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FCP Admin API binary - management and administration endpoints"

[[bin]]
name = "fcp-admin"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-api-core = { path = "../fcp-api-core" }
fcp-admin-ui = { path = "../fcp-admin-ui" }
fcp-sip = { path = "../fcp-sip" }
fcp-media = { path = "../fcp-media" }
fcp-b2bua-core = { path = "../fcp-b2bua-core" }
fcp-events = { path = "../fcp-events" }

# For NoopDispatcher
async-trait = "0.1"
bytes = { workspace = true }

# Storage backend
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
fcp-storage-redis = { path = "../fcp-storage-redis" }

# Cluster monitoring
fcp-cluster = { path = "../fcp-cluster" }

# Web framework (for merging admin UI router)
axum = "0.7"
serde_json = { workspace = true }

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { workspace = true }
uuid = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP client for event forwarding
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# For future connection pooling
dashmap = "6"
