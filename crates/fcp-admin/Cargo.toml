[package]
name = "fcp-admin"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FCP Admin API binary - management and administration endpoints"

[features]
default = []
redis = ["fcp-presence/redis"]

[[bin]]
name = "fcp-admin"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-cdr = { path = "../fcp-cdr" }
fcp-billing = { path = "../fcp-billing" }
fcp-api-core = { path = "../fcp-api-core" }
fcp-admin-ui = { path = "../fcp-admin-ui" }
fcp-sip = { path = "../fcp-sip" }
fcp-media = { path = "../fcp-media" }
fcp-b2bua-core = { path = "../fcp-b2bua-core" }
fcp-events = { path = "../fcp-events" }
fcp-flow = { path = "../fcp-flow" }

# For NoopDispatcher
async-trait = "0.1"
urlencoding = "2"
bytes = { workspace = true }

# Storage backend
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
fcp-storage-redis = { path = "../fcp-storage-redis", features = ["cdr"] }

# Presence (read-only, for admin UI)
fcp-presence = { path = "../fcp-presence" }

# Cluster monitoring
fcp-cluster = { path = "../fcp-cluster", features = ["openapi"] }

# Web framework (for merging admin UI router)
axum = { version = "0.7", features = ["macros"] }
# The link listeners (docs/HYBRID_CONTROL_PLANE.md phase 1): the enroll
# listener over TLS, the link listener under mutual TLS from the link CA
# this process keeps and signs sites' certificates with.
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde_json = { workspace = true }
# The OpenAPI contract (docs/DEVELOPER_SURFACE.md §3, phase 3)
utoipa = { version = "6", features = ["preserve_order", "preserve_path_order"] }

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { workspace = true }
uuid = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP client for event forwarding
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket client for subscribing to events server
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# For future connection pooling
dashmap = "6"

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
tower = { version = "0.5", features = ["util"] }
