[package]
name = "fcp-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for FCP - Ferrous Communications Platform"

[[bin]]
name = "fcp"
path = "src/main.rs"

[dependencies]
# FCP core types for shared identifiers
fcp-core = { path = "../fcp-core" }

# CLI framework
clap = { version = "4", features = ["derive", "env", "color", "suggestions"] }

# TUI framework (for Phase 3+)
ratatui = "0.30"
crossterm = "0.28"
tui-input = "0.11"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Config management
directories = "5"

# Time handling
chrono = "0.4"
humantime = "2"

# Logging (for debug mode)
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Output formatting
comfy-table = "7"
colored = "2"
indicatif = "0.17"

[dev-dependencies]
mockito = "1"
tempfile = "3"
tokio-test = "0.4"
