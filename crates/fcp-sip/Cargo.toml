[package]
name = "fcp-sip"
edition.workspace = true
version = "0.2.16"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Integration layer between fcp-core and siphon-rs SIP stack"

[features]
default = []
tls = ["sip-transport/tls", "tokio-rustls", "rustls-native-certs"]

[dependencies]
# FCP core types
fcp-core = { path = "../fcp-core" }
fcp-b2bua-core = { path = "../fcp-b2bua-core" }
fcp-routing = { path = "../fcp-routing" }
fcp-media = { path = "../fcp-media" }
fcp-events = { path = "../fcp-events" }
fcp-flow = { path = "../fcp-flow" }
fcp-voicemail = { path = "../fcp-voicemail" }
fcp-pbx = { path = "../fcp-pbx" }
fcp-presence = { path = "../fcp-presence" }
fcp-queue = { path = "../fcp-queue" }

# SIP stack from siphon-rs (as path dependencies from submodule)
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-parse = { path = "../../external/siphon-rs/crates/sip-parse" }
sip-transport = { path = "../../external/siphon-rs/crates/sip-transport" }
sip-transaction = { path = "../../external/siphon-rs/crates/sip-transaction" }
sip-dialog = { path = "../../external/siphon-rs/crates/sip-dialog" }
sip-dns = { path = "../../external/siphon-rs/crates/sip-dns" }
sip-auth = { path = "../../external/siphon-rs/crates/sip-auth" }
sip-registrar = { path = "../../external/siphon-rs/crates/sip-registrar" }
sip-sdp = { path = "../../external/siphon-rs/crates/sip-sdp" }
sip-uac = { path = "../../external/siphon-rs/crates/sip-uac" }
sip-uas = { path = "../../external/siphon-rs/crates/sip-uas" }
sip-ratelimit = { path = "../../external/siphon-rs/crates/sip-ratelimit" }

# Common dependencies
anyhow = { workspace = true }
async-trait = "0.1"
bytes = { workspace = true }
dashmap = "6.0"
serde = { workspace = true }
smol_str = "0.3"
socket2 = "0.5"
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
urlencoding = "2.1"
uuid = { workspace = true }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md5 = "0.7"
rand = "0.8"

# TLS support (optional) - must match sip-transport's rustls version (0.22)
tokio-rustls = { version = "0.25", optional = true }
rustls-native-certs = { version = "0.7", optional = true }
regex = "1"
serde_json = "1"
tempfile = "3.23.0"
futures = "0.3.31"

[dev-dependencies]
sip-testkit = { path = "../../external/siphon-rs/crates/sip-testkit" }
tokio = { version = "1", features = ["full", "test-util"] }
