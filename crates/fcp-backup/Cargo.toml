[package]
name = "fcp-backup"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Backups from the admin: the database and the files to restic repositories off the box (docs/SCHEDULED_BACKUPS.md)"

[[bin]]
name = "fcp-backup"
path = "src/main.rs"

[dependencies]
fcp-core = { path = "../fcp-core" }
fcp-events = { path = "../fcp-events" }
fcp-cluster = { path = "../fcp-cluster" }
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
fcp-storage-redis = { path = "../fcp-storage-redis" }
fcp-crypto = { path = "../fcp-crypto" }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The full restore swaps the database by rename (docs/SCHEDULED_BACKUPS.md B3c).
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
url = "2"

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
url = "2"
fcp-testkit = { path = "../fcp-testkit" }
tempfile = "3"
