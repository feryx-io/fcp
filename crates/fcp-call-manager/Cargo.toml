[package]
name = "fcp-call-manager"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Combined SIP registrar and B2BUA call handler for the Ferrous Communications Platform"

[features]
default = ["storage-sqlite", "tls"]
tls = ["fcp-sip/tls"]
storage-sqlite = ["dep:fcp-storage-sqlite"]
storage-postgres = ["dep:fcp-storage-postgres"]
storage-mysql = ["dep:fcp-storage-mysql"]
storage-mongodb = ["dep:fcp-storage-mongodb"]
storage-redis = ["dep:fcp-storage-redis", "dep:fcp-cluster"]
storage-all = ["storage-sqlite", "storage-postgres", "storage-mysql", "storage-mongodb", "storage-redis"]

[[bin]]
name = "fcp-call-manager"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-sip = { path = "../fcp-sip" }
fcp-sbc-core = { path = "../fcp-sbc-core" }
fcp-b2bua-core = { path = "../fcp-b2bua-core" }
fcp-routing = { path = "../fcp-routing" }
fcp-media = { path = "../fcp-media" }
fcp-events = { path = "../fcp-events" }
fcp-flow = { path = "../fcp-flow" }
fcp-pbx = { path = "../fcp-pbx" }
fcp-queue = { path = "../fcp-queue" }
fcp-presence = { path = "../fcp-presence" }

# Forge media crates
forge-rtp = { path = "../../external/forge-media/crates/forge-rtp" }
forge-codecs = { path = "../../external/forge-media/crates/forge-codecs" }
forge-dtmf = { path = "../../external/forge-media/crates/forge-dtmf" }
forge-recorder = { path = "../../external/forge-media/crates/forge-recorder" }
forge-core = { path = "../../external/forge-media/crates/forge-core" }
forge-transcoder = { path = "../../external/forge-media/crates/forge-transcoder" }

# Storage backends (optional)
fcp-storage-sqlite = { path = "../fcp-storage-sqlite", optional = true }
fcp-storage-postgres = { path = "../fcp-storage-postgres", optional = true }
fcp-storage-mysql = { path = "../fcp-storage-mysql", optional = true }
fcp-storage-mongodb = { path = "../fcp-storage-mongodb", optional = true }
fcp-storage-redis = { path = "../fcp-storage-redis", features = ["event-bus"], optional = true }
fcp-cluster = { path = "../fcp-cluster", optional = true }

# SIP stack from siphon-rs
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-transport = { path = "../../external/siphon-rs/crates/sip-transport" }
sip-transaction = { path = "../../external/siphon-rs/crates/sip-transaction" }
sip-dialog = { path = "../../external/siphon-rs/crates/sip-dialog" }
sip-dns = { path = "../../external/siphon-rs/crates/sip-dns" }
sip-uac = { path = "../../external/siphon-rs/crates/sip-uac" }
sip-observe = { path = "../../external/siphon-rs/crates/sip-observe" }
sip-sdp = { path = "../../external/siphon-rs/crates/sip-sdp" }
sip-uas = { path = "../../external/siphon-rs/crates/sip-uas" }
sip-parse = { path = "../../external/siphon-rs/crates/sip-parse" }
sip-ratelimit = { path = "../../external/siphon-rs/crates/sip-ratelimit" }

# HTTP API
axum = { version = "0.7", features = ["ws"] }

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
async-trait = "0.1"
bytes = { workspace = true }
dashmap = "6"
parking_lot = "0.12"
smol_str = "0.3"
socket2 = "0.5"
uuid = { workspace = true }

# HTTP client for event forwarding
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
