[package]
name = "fcp-core"
version = "0.3.1"
edition = "2021"
description = "Core types and traits for the FCP PBX."
license = "MIT OR Apache-2.0"
repository = "https://example.com/fcp"

[features]
default = []

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
bcrypt = { workspace = true }
bytes = { workspace = true }
chrono = "0.4"
md5 = "0.7"
serde = { workspace = true }
serde_json = "1.0"
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "sync", "macros", "rt", "time"] }
tracing = "0.1"
uuid = { workspace = true }
