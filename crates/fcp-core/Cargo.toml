[package]
name = "fcp-core"
version = "0.6.0"
edition = "2021"
description = "Core types and traits for the FCP PBX."
license = "MIT OR Apache-2.0"
repository = "https://example.com/fcp"

[features]
default = []

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
bcrypt = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
md5 = "0.7"
serde = { workspace = true }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "sync", "macros", "rt", "time"] }
tracing = "0.1"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
