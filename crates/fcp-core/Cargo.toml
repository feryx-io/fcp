[package]
name = "fcp-core"
version = "0.6.0"
edition = "2021"
description = "Core types and traits for the FCP PBX."
license = "MIT OR Apache-2.0"
repository = "https://example.com/fcp"

[features]
# ToSchema on the types the admin API returns (docs/DEVELOPER_SURFACE.md
# §3, phase 3); only fcp-api-core turns it on.
openapi = ["dep:utoipa"]
default = []

[dependencies]
url = "2"
anyhow = { workspace = true }
async-trait = "0.1"
bcrypt = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dashmap = "6"
md5 = "0.7"
serde = { workspace = true }
serde_json = "1.0"
toml = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
sha1 = "0.10"
data-encoding = "2"
tar = "0.4"
flate2 = "1"
base64 = "0.22"
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt", "time"] }
tracing = "0.1"
uuid = { workspace = true }
rust_decimal = { workspace = true }
quick-xml = "0.41"
minijinja = { version = "2.24", features = ["fuel"] }
ipnetwork = { version = "0.20", features = ["serde"] }

utoipa = { version = "6", optional = true, features = ["preserve_order", "chrono"] }

[dev-dependencies]
tempfile = "3"
