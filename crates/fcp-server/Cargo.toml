[package]
name = "fcp-server"
edition.workspace = true
version = "0.3.2"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FCP server binary - main entry point for the FCP platform"

[features]
default = ["tls", "storage-sqlite"]
tls = ["fcp-runtime/tls"]
storage-sqlite = ["fcp-storage-sqlite"]
storage-postgres = ["fcp-storage-postgres"]
storage-mysql = ["fcp-storage-mysql"]
storage-mongodb = ["fcp-storage-mongodb"]
storage-all = ["storage-sqlite", "storage-postgres", "storage-mysql", "storage-mongodb"]

[[bin]]
name = "fcp-server"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-runtime = { path = "../fcp-runtime" }
fcp-sip = { path = "../fcp-sip" }
fcp-media = { path = "../fcp-media" }
fcp-events = { path = "../fcp-events" }
fcp-flow = { path = "../fcp-flow" }

# Storage backends (optional)
fcp-storage-sqlite = { path = "../fcp-storage-sqlite", optional = true }
fcp-storage-postgres = { path = "../fcp-storage-postgres", optional = true }
fcp-storage-mysql = { path = "../fcp-storage-mysql", optional = true }
fcp-storage-mongodb = { path = "../fcp-storage-mongodb", optional = true }

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
futures-util = "0.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# REST API
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde_json = "1.0"
