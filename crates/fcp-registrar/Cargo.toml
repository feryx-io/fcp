[package]
name = "fcp-registrar"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standalone SIP registrar for the Ferrous Communications Platform"

[[bin]]
name = "fcp-registrar"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-sip = { path = "../fcp-sip", features = ["tls", "ws"] }
fcp-sbc-core = { path = "../fcp-sbc-core" }
fcp-events = { path = "../fcp-events" }

# Storage backend
fcp-storage-postgres = { path = "../fcp-storage-postgres" }

# SIP stack from siphon-rs
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-parse = { path = "../../external/siphon-rs/crates/sip-parse" }
sip-transport = { path = "../../external/siphon-rs/crates/sip-transport", features = ["tls", "ws"] }
sip-transaction = { path = "../../external/siphon-rs/crates/sip-transaction" }
sip-auth = { path = "../../external/siphon-rs/crates/sip-auth" }
sip-observe = { path = "../../external/siphon-rs/crates/sip-observe" }

# HTTP health endpoint
axum = "0.7"

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }

# Transport
async-trait = "0.1"
bytes = { workspace = true }
smol_str = "0.3"
uuid = { workspace = true }
tokio-rustls = "0.26"

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
