[package]
name = "fcp-notify"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "On-site notification of emergency calls (Kari's Law): contacts, channels and delivery"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-events = { path = "../fcp-events" }
fcp-webhooks = { path = "../fcp-webhooks" }

# Channels
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
] }

async-trait = "0.1"
anyhow = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
uuid = { workspace = true }
