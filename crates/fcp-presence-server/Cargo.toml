[package]
name = "fcp-presence-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standalone SIP presence server for the Ferrous Communications Platform"

[features]
default = ["storage-redis"]
redis = ["fcp-presence/redis"]
webhook = ["fcp-presence/webhook"]
storage-redis = ["dep:fcp-storage-redis", "dep:fcp-cluster"]

[[bin]]
name = "fcp-presence"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-sip = { path = "../fcp-sip", features = ["tls"] }
fcp-presence = { path = "../fcp-presence" }
fcp-events = { path = "../fcp-events" }

# Storage backend
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
fcp-storage-redis = { path = "../fcp-storage-redis", optional = true }
fcp-cluster = { path = "../fcp-cluster", optional = true }

# SIP stack from siphon-rs
sip-dns = { path = "../../external/siphon-rs/crates/sip-dns" }
sip-observe = { path = "../../external/siphon-rs/crates/sip-observe" }
sip-transaction = { path = "../../external/siphon-rs/crates/sip-transaction" }
sip-transport = { path = "../../external/siphon-rs/crates/sip-transport" }
sip-uac = { path = "../../external/siphon-rs/crates/sip-uac" }

# HTTP API
axum = "0.7"

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Hashing (ETag computation)
sha2 = "0.10"

# Utilities
socket2 = "0.5"
uuid = { workspace = true }
