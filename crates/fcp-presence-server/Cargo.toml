[package]
name = "fcp-presence-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standalone SIP presence server for the Ferrous Communications Platform"

[features]
default = ["storage-sqlite"]
storage-sqlite = ["dep:fcp-storage-sqlite"]
storage-postgres = ["dep:fcp-storage-postgres"]
storage-mysql = ["dep:fcp-storage-mysql"]
storage-mongodb = ["dep:fcp-storage-mongodb"]
storage-all = ["storage-sqlite", "storage-postgres", "storage-mysql", "storage-mongodb"]
redis = ["fcp-presence/redis"]

[[bin]]
name = "fcp-presence"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-sip = { path = "../fcp-sip" }
fcp-presence = { path = "../fcp-presence" }
fcp-events = { path = "../fcp-events" }

# Storage backends (optional)
fcp-storage-sqlite = { path = "../fcp-storage-sqlite", optional = true }
fcp-storage-postgres = { path = "../fcp-storage-postgres", optional = true }
fcp-storage-mysql = { path = "../fcp-storage-mysql", optional = true }
fcp-storage-mongodb = { path = "../fcp-storage-mongodb", optional = true }

# HTTP API
axum = "0.7"

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Hashing (ETag computation)
sha2 = "0.10"

# Utilities
uuid = { workspace = true }
