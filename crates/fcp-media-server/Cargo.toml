[package]
name = "fcp-media-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standalone media processing server for the Ferrous Communications Platform"

[features]
default = ["storage-redis"]
storage-redis = ["dep:fcp-storage-redis", "dep:fcp-cluster"]

[[bin]]
name = "fcp-media"
path = "src/main.rs"

[dependencies]
# forge-media crates (media engine)
forge-api = { path = "../../external/forge-media/crates/forge-api" }
forge-core = { path = "../../external/forge-media/crates/forge-core" }

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }

fcp-core = { path = "../fcp-core" }
fcp-events = { path = "../fcp-events" }
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
fcp-storage-redis = { path = "../fcp-storage-redis", optional = true }
fcp-cluster = { path = "../fcp-cluster", optional = true }
