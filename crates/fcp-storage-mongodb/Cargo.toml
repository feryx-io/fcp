[package]
name = "fcp-storage-mongodb"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MongoDB storage backend for FCP"

[dependencies]
# Core dependencies
fcp-core = { path = "../fcp-core" }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# MongoDB database
mongodb = "3.1"
tokio = { version = "1.48", features = ["full"] }

# Time handling
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bson = { version = "2.13", features = ["chrono-0_4"] }

# Logging
tracing = "0.1"

# UUID support
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
