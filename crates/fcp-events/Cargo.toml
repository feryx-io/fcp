[package]
name = "fcp-events"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Core dependencies
fcp-core = { path = "../fcp-core" }
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
uuid.workspace = true
serde_json = "1.0"

# Logging
tracing = "0.1"

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
