[package]
name = "fcp-storage-postgres"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PostgreSQL storage backend for FCP"

[dependencies]
# Core dependencies
fcp-core = { path = "../fcp-core" }
fcp-flow = { path = "../fcp-flow" }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# PostgreSQL database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono"] }
tokio = { version = "1.48", features = ["full"] }
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# UUID support
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
