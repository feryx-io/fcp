<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join meeting</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #f6f6f6; --card: #fff; --muted: #666; --accent: #2563eb; --danger: #b91c1c; --ok: #15803d; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #121212; --card: #1e1e1e; --muted: #aaa; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1 1 200px; }
  button { padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #8884; color: inherit; }
  button.danger { background: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .videos { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { .videos { grid-template-columns: 3fr 1fr; } }
  video { width: 100%; background: #000; border-radius: 8px; aspect-ratio: 16/9; }
  #self { transform: scaleX(-1); }
  /* While a screen is shared it takes the large slot; the composite and
     the camera go down the side. */
  .videos.sharing { grid-template-columns: 1fr; }
  @media (min-width: 720px) { .videos.sharing { grid-template-columns: 3fr 1fr; } }
  .videos.sharing #content { grid-row: 1 / span 2; }
  .videos:not(.sharing) #content { display: none; }
  .share { font-size: 13px; color: var(--muted); }
  .status { font-size: 13px; color: var(--muted); }
  .status b { color: var(--fg); }
  .state-connected { color: var(--ok); }
  .state-failed { color: var(--danger); }
  #log { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-height: 200px; overflow: auto; color: var(--muted); margin: 0; }
  .hidden { display: none !important; }
  /* A room that forwards: each person on a tile of their own. */
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); align-content: start; }
  .tile { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; outline: 3px solid transparent; outline-offset: -3px; transition: outline-color .15s; }
  .tile video { position: absolute; inset: 0; height: 100%; border-radius: 0; aspect-ratio: auto; object-fit: cover; }
  .tile.large { grid-column: 1 / -1; }
  .tile.speaking { outline-color: var(--ok); }
  .tile .initials { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 32px; color: #ddd; }
  .tile.novideo .initials { display: flex; }
  .tile.novideo video { visibility: hidden; }
  .tile .label { position: absolute; left: 6px; bottom: 6px; right: 44px; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .pin { position: absolute; right: 6px; bottom: 6px; padding: 2px 8px; font-size: 12px; background: rgba(0,0,0,.6); }
  .tile.pinned .pin { background: var(--accent); }
  .qa { margin-top: 12px; }
  .qa ol { padding-left: 20px; }
  .qa li { margin: 6px 0; }
  .qa li .meta { opacity: 0.7; font-size: 0.9em; }
  .qa li .answer { margin-left: 12px; font-style: italic; }
  .qa li button { margin-left: 6px; padding: 2px 8px; font-size: 0.85em; }
</style>
</head>
<body>
<main>
  <h1>Join meeting</h1>

  <section class="card" id="setup">
    <div class="row">
      <div><label for="room">Room</label><input type="text" id="room" placeholder="8001" autocomplete="off"></div>
      <div><label for="name">Your name</label><input type="text" id="name" placeholder="Ann" autocomplete="name"></div>
    </div>
    <div class="row">
      <div><label for="token">Join token</label><input type="password" id="token" placeholder="from the meeting's Join in browser link" autocomplete="off"></div>
      <div style="flex: 0 0 auto"><label><input type="checkbox" id="video" checked> Send my camera</label></div>
    </div>
    <div class="row" style="margin-top: 12px">
      <div style="flex: 0 0 auto"><button id="join">Join</button></div>
      <div class="status" id="setup-status"></div>
    </div>
  </section>

  <section class="card hidden" id="call">
    <div class="videos" id="videos">
      <video id="content" autoplay playsinline></video>
      <video id="remote" autoplay playsinline></video>
      <div class="grid hidden" id="grid"></div>
      <video id="self" autoplay playsinline muted></video>
    </div>
    <div class="row" style="margin-top: 12px">
      <div style="flex: 0 0 auto"><button id="leave" class="danger">Leave</button></div>
      <div style="flex: 0 0 auto"><button id="mute" class="secondary">Mute</button></div>
      <div style="flex: 0 0 auto"><button id="share" class="secondary hidden">Share screen</button></div>
      <div style="flex: 0 0 auto"><button id="hand" class="secondary">Raise hand</button></div>
      <div class="status" id="call-status"></div>
    </div>
    <div class="share" id="share-status"></div>
    <div class="qa hidden" id="qa">
      <h3>Questions</h3>
      <ol id="questions"></ol>
      <div class="row">
        <div><input type="text" id="question" maxlength="500" placeholder="Ask a question" autocomplete="off"></div>
        <div style="flex: 0 0 auto"><label><input type="checkbox" id="anonymous"> Anonymously</label></div>
        <div style="flex: 0 0 auto"><button id="ask" class="secondary">Ask</button></div>
      </div>
    </div>
    <div class="qa hidden" id="chat">
      <h3>Chat</h3>
      <ol id="messages"></ol>
      <div class="row">
        <div><input type="text" id="message" maxlength="1000" placeholder="Send a message" autocomplete="off"></div>
        <div style="flex: 0 0 auto"><select id="to"><option value="room">Everyone</option><option value="hosts">Hosts</option></select></div>
        <div style="flex: 0 0 auto"><button id="send" class="secondary">Send</button></div>
      </div>
    </div>
    <audio id="audio" autoplay></audio>
  </section>

  <section class="card">
    <pre id="log"></pre>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  // Not a constant: a gateway leaving service can send this browser to
  // another one, and everything after the move talks to that one.
  let api = params.get('gateway') || location.origin;
  $('room').value = params.get('room') || '';
  $('name').value = params.get('name') || '';
  $('token').value = params.get('token') || '';
  if (params.has('video')) $('video').checked = params.get('video') !== 'false';
  // The token is not something to leave in the address bar.
  if (params.has('token')) history.replaceState(null, '', location.pathname + (params.get('room') ? `?room=${encodeURIComponent(params.get('room'))}` : ''));

  let session = null;      // { id, session_token }
  let joined = null;       // what this browser joined with, for a move
  let moving = false;      // a move to another gateway is in flight
  let movedAt = 0;         // when the last move was tried, to retry slowly
  let pc = null;
  let local = null;
  let poll = null;
  let screen = null;       // the shared screen's MediaStream while sharing
  let contentSender = null;  // the content section's RTCRtpSender
  let noticesSeen = 0;     // the floor notices the session had taken in, last seen
  let noticesAtShare = 0;  // ... when this share started

  // A room that forwards (docs/FORWARDING_ROOMS.md §2.7) sends each person
  // on a track of their own: the browser takes STREAMS send-only sections
  // at the start, and the session's `forwarding` says who is in the room
  // and whose stream is on which section. The page draws its own grid,
  // and tells the room what it shows as its view.
  const STREAMS = Math.min(25, Math.max(0, Number(params.get('streams') ?? 9) || 0));
  let forwarding = null;          // the session's `forwarding`, last read
  const streamTracks = new Map(); // a section's mid -> its track
  const tiles = new Map();        // a member's id -> their tile
  let pinned = null;              // the member pinned large, by id
  let sentView = null;            // the view the room has, as sent
  let polling = 0;                // the status poll's period
  let shownStreams = '';          // whose stream is on which track, as last logged

  const log = (line) => { $('log').textContent += `${new Date().toISOString().slice(11, 19)} ${line}\n`; $('log').scrollTop = $('log').scrollHeight; };
  const setStatus = (el, html) => { $(el).innerHTML = html; };

  async function call(method, path, body, sessionToken, base) {
    const headers = { 'Content-Type': 'application/json' };
    if (sessionToken) headers['Authorization'] = `Bearer ${sessionToken}`;
    const res = await fetch((base || api) + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch (_) {}
    if (!res.ok) throw new Error((json && json.error) || `${res.status} ${res.statusText}`);
    return json;
  }

  function stateClass(state) {
    if (state === 'connected') return 'state-connected';
    if (typeof state === 'object' || state === 'terminated') return 'state-failed';
    return '';
  }

  function describe(info) {
    const state = typeof info.state === 'string' ? info.state : `failed: ${info.state.failed}`;
    const parts = [`<b class="${stateClass(info.state)}">${state}</b>`];
    if (info.audio_codec) parts.push(`audio ${info.audio_codec}${info.srtp ? ' (SRTP)' : ''}`);
    if (info.video) parts.push(`video ${info.video.codec}`); else if (info.state === 'connected') parts.push('audio only');
    // A webinar's phase (W4): waiting in its lobby, or ended.
    if (info.qa && info.qa.lobby) parts.push('waiting for the webinar to start');
    else if (info.qa && info.qa.webinar === 'ended') parts.push('the webinar has ended');
    if (info.stats) {
      const s = info.stats;
      parts.push(`↑${s.audio_to_sip + s.video_to_sip + (s.content_to_sip || 0)} ↓${s.audio_to_browser + s.video_to_browser + (s.content_to_browser || 0) + (s.streams_to_browser || 0)} packets`);
    }
    return parts.join(' · ');
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // The floor as the gateway heard it from the conference server: who is
  // sharing, and whether this browser's share was refused or ended.
  function describeShare(content) {
    if (!content) return '';
    const who = content.presenter ? esc(content.presenter) : 'Someone';
    switch (content.state) {
      case 'granted': return 'You are sharing your screen.';
      case 'held': return `${who} is sharing.`;
      case 'refused': return `Sharing was refused${content.reason === 'held' ? ` (${who} is sharing)` : content.reason ? ` (${content.reason})` : ''}.`;
      case 'released': return content.reason === 'host' ? 'A host stopped your share.' : '';
      default: return '';
    }
  }

  // Answer one gateway's offer: the peer connection, its tracks and its
  // candidates, all pointed at the node that made it. Called once when
  // joining, and again when a node leaving service sends this browser to
  // another one.
  async function attach(created, base) {
    const id = created.id;
    const token = created.session_token;
    const conn = new RTCPeerConnection({ iceServers: created.ice_servers || [] });
    conn.ontrack = (ev) => {
      const mid = ev.transceiver && ev.transceiver.mid;
      // Sections after the screen's (mid 3 on) are a forwarding room's
      // tracks, a person each.
      if (ev.track.kind === 'video' && Number(mid) >= 3) {
        streamTracks.set(mid, ev.track);
        render();
        return;
      }
      if (ev.track.kind === 'audio') {
        log('remote audio track');
        $('audio').srcObject = new MediaStream([ev.track]);
        return;
      }
      // The second video section (mid 2) is the room's shared screen.
      if (mid === '2') {
        log('content track');
        $('content').srcObject = new MediaStream([ev.track]);
        // The track goes quiet between shares: show it only while it flows.
        ev.track.onunmute = () => $('videos').classList.add('sharing');
        ev.track.onmute = () => $('videos').classList.remove('sharing');
        return;
      }
      log('remote video track');
      $('remote').srcObject = new MediaStream([ev.track]);
    };
    conn.onicecandidate = async (ev) => {
      if (!ev.candidate) return;
      try { await call('POST', `/v1/rooms/${id}/ice-candidate`, { candidate: ev.candidate.candidate }, token, base); }
      catch (e) { log(`candidate refused: ${e.message}`); }
    };
    conn.onconnectionstatechange = () => log(`peer connection ${conn.connectionState}`);
    await conn.setRemoteDescription({ type: 'offer', sdp: created.sdp_offer });
    for (const track of local.getTracks()) conn.addTrack(track, local);
    // The offer's third section is for a screen. Answering it sendrecv
    // with no track yet means sharing later is a replaceTrack, not a
    // renegotiation; a browser without getDisplayMedia leaves it recvonly.
    let sender = null;
    const contentTransceiver = conn.getTransceivers().find((t) => t.mid === '2');
    if (contentTransceiver && navigator.mediaDevices.getDisplayMedia) {
      contentTransceiver.direction = 'sendrecv';
      sender = contentTransceiver.sender;
      $('share').classList.remove('hidden');
    }
    const answer = await conn.createAnswer();
    await conn.setLocalDescription(answer);
    await sizeSimulcast(conn);
    await call('POST', `/v1/rooms/${id}/answer`, { sdp_answer: answer.sdp }, token, base);
    return { pc: conn, contentSender: sender };
  }

  // The gateway asks for the camera as simulcast: three encodings named
  // h, m and l. A browser that agreed made them, but leaves their sizes to
  // us: full, half and a quarter, so the room can decode the one its tile
  // needs (docs/FORWARDING_ROOMS.md §2.7). A browser that did not agree
  // has one encoding, and nothing is changed.
  const SIMULCAST_SCALE = { h: 1, m: 2, l: 4 };
  async function sizeSimulcast(conn) {
    const camera = conn.getTransceivers().find((t) => t.mid === '1');
    if (!camera || !camera.sender.track) return;
    const params = camera.sender.getParameters();
    if (!params.encodings || params.encodings.length < 2) return;
    for (const e of params.encodings) {
      if (e.rid in SIMULCAST_SCALE) e.scaleResolutionDownBy = SIMULCAST_SCALE[e.rid];
    }
    try {
      await camera.sender.setParameters(params);
      log(`camera sent as ${params.encodings.length} simulcast layers`);
    } catch (e) {
      log(`simulcast sizes refused: ${e.message}`);
    }
  }

  // This gateway is leaving service and has said so in the session's
  // status (`docs/CAPACITY_AND_SURVIVABILITY.md` §6). Join the room again
  // — on the gateway it named, or where we are, which behind a load
  // balancer means a serving node — with the same camera and microphone,
  // and only then leave the old session, so the room is never left. If
  // the move fails (an expired join token, a node that will not take us)
  // the old session is kept: it plays on until that node's deadline.
  async function moveTo(advice) {
    // A failed move is retried, but not on every poll: without a named
    // gateway the browser re-joins where it is, and that is the node
    // that is leaving until a load balancer says otherwise.
    if (moving || !session || !joined || Date.now() - movedAt < 10000) return;
    moving = true;
    movedAt = Date.now();
    const target = (advice.url || api).replace(/\/+$/, '');
    const from = { api, id: session.id, token: session.token };
    log(`gateway leaving service; joining ${target === api ? 'again' : target}`);
    setStatus('call-status', 'Moving to another gateway…');
    try {
      const created = await call('POST', `/v1/rooms/${encodeURIComponent(joined.room)}/join`,
        { display_name: joined.name, video: joined.video, join_token: joined.token || null, streams: joined.video ? STREAMS : 0 }, null, target);
      const old = pc;
      $('remote').srcObject = null;
      $('audio').srcObject = null;
      forgetForwarding();
      $('content').srcObject = null;
      $('videos').classList.remove('sharing');
      const attached = await attach(created, target);
      api = target;
      session = { id: created.id, token: created.session_token };
      pc = attached.pc;
      contentSender = attached.contentSender;
      // A share in progress follows the browser to the new node.
      if (screen && contentSender) {
        try { await contentSender.replaceTrack(screen.getVideoTracks()[0]); }
        catch (e) { log(`the share did not follow: ${e.message}`); }
      }
      if (old) old.close();
      try { await call('DELETE', `/v1/rooms/${from.id}`, null, from.token, from.api); }
      catch (e) { log(`leaving the old gateway: ${e.message}`); }
      log(`moved to ${api}`);
    } catch (e) {
      log(`move failed: ${e.message}; staying on this gateway`);
    }
    moving = false;
  }

  async function join() {
    const room = $('room').value.trim();
    const name = $('name').value.trim();
    const token = $('token').value.trim();
    const wantVideo = $('video').checked;
    if (!room) { setStatus('setup-status', 'A room number is needed.'); return; }
    $('join').disabled = true;
    setStatus('setup-status', 'Asking the gateway…');
    try {
      local = await navigator.mediaDevices.getUserMedia({ audio: true, video: wantVideo });
      $('self').srcObject = local;
    } catch (e) {
      log(`getUserMedia failed: ${e.message}`);
      setStatus('setup-status', `Could not open the microphone or camera: ${e.message}`);
      $('join').disabled = false;
      return;
    }
    try {
      const created = await call('POST', `/v1/rooms/${encodeURIComponent(room)}/join`, { display_name: name, video: wantVideo, join_token: token || null, streams: wantVideo ? STREAMS : 0 }, null);
      session = { id: created.id, token: created.session_token };
      joined = { room, name, video: wantVideo, token };
      log(`session ${created.id} created; answering the gateway's offer`);

      const attached = await attach(created, api);
      pc = attached.pc;
      contentSender = attached.contentSender;
      log('answer sent; connecting');
      $('setup').classList.add('hidden');
      $('call').classList.remove('hidden');
      pollEvery(2000);
      refresh();
    } catch (e) {
      log(`join failed: ${e.message}`);
      setStatus('setup-status', `<span class="state-failed">${e.message}</span>`);
      await cleanup(false);
      $('join').disabled = false;
    }
  }

  async function refresh() {
    if (!session) return;
    try {
      const info = await call('GET', `/v1/rooms/${session.id}`, null, session.token);
      setStatus('call-status', describe(info));
      setStatus('share-status', describeShare(info.content));
      if (info.content) noticesSeen = info.content.notices || 0;
      showForwarding(info.forwarding || null);
      showHand(info.qa || null);
      showQuestions(info.qa || null);
      showChat(info.chat || null, !!(info.qa && info.qa.moderates));
      // A host stopped the share, or the room refused it: stop sending.
      // Only a verdict newer than this share counts; an earlier one is history.
      if (screen && info.content && noticesSeen > noticesAtShare && (info.content.state === 'refused' || info.content.state === 'released')) stopSharing('the room ended it');
      if (info.state === 'terminated' || typeof info.state === 'object') {
        log(`session over: ${typeof info.state === 'object' ? info.state.failed : info.state}`);
        await cleanup(false);
        return;
      }
      // The gateway is leaving service: join another one before it goes.
      if (info.handover) await moveTo(info.handover);
    } catch (e) {
      log(`status: ${e.message}`);
    }
  }

  function pollEvery(ms) {
    if (polling === ms) return;
    if (poll) clearInterval(poll);
    poll = setInterval(refresh, ms);
    polling = ms;
  }

  // The room forwards, or has stopped (a move to a node that mixes): the
  // grid in place of the room's one picture, drawn from what the session
  // says, and the view sent when it changes. Read every second while
  // forwarding, so the speaking rings keep up.
  function showForwarding(f) {
    forwarding = f;
    $('grid').classList.toggle('hidden', !f);
    $('remote').classList.toggle('hidden', !!f);
    if (!f) return;
    if (session) pollEvery(1000);
    render();
    sendView();
  }

  function forgetForwarding() {
    forwarding = null;
    streamTracks.clear();
    for (const t of tiles.values()) t.el.remove();
    tiles.clear();
    pinned = null;
    sentView = null;
    shownStreams = '';
    $('grid').classList.add('hidden');
    $('remote').classList.remove('hidden');
  }

  // The members the grid shows: everyone but this browser, which is the
  // one member with our name when exactly one has it (the room does not
  // say which is us; the self view shows us anyway).
  function others() {
    const members = (forwarding && forwarding.members) || [];
    const mine = joined ? members.filter((m) => m.name === joined.name) : [];
    return mine.length === 1 ? members.filter((m) => m !== mine[0]) : members;
  }

  // Who is large: the pinned member, else whoever a host spotlit.
  function largeOne(members) {
    if (pinned && members.some((m) => m.id === pinned)) return pinned;
    const lit = members.find((m) => m.spotlight);
    return lit ? lit.id : null;
  }

  const initials = (name) => String(name).split(/\s+/).filter(Boolean).slice(0, 2).map((w) => [...w][0]).join('').toUpperCase() || '?';

  function makeTile(id) {
    const el = document.createElement('div');
    el.className = 'tile novideo';
    el.dataset.id = id;
    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    const face = document.createElement('div');
    face.className = 'initials';
    const label = document.createElement('div');
    label.className = 'label';
    const pin = document.createElement('button');
    pin.className = 'pin';
    pin.textContent = 'Pin';
    pin.addEventListener('click', () => {
      pinned = pinned === id ? null : id;
      log(pinned ? `pinned ${tiles.get(id).name}` : 'unpinned');
      render();
      sendView();
    });
    el.append(video, face, label, pin);
    $('grid').appendChild(el);
    return { el, video, face, label, pin, track: null, name: '' };
  }

  function render() {
    if (!forwarding) return;
    const members = others();
    const large = largeOne(members);
    // Each person's own stream, else the speaker stream while it shows them.
    const own = new Map();
    const speaker = new Map();
    for (const s of forwarding.streams || []) {
      if (!s.participant) continue;
      (s.speaker ? speaker : own).set(s.participant, s.mid);
    }
    const named = (forwarding.streams || [])
      .map((s) => `${s.mid}→${s.speaker ? 'speaker:' : ''}${(members.find((m) => m.id === s.participant) || {}).name || s.participant || '?'}`)
      .join(' ');
    if (named !== shownStreams) {
      shownStreams = named;
      log(`tracks: ${named || 'none'}`);
    }
    const seen = new Set();
    members.forEach((m, i) => {
      seen.add(m.id);
      const t = tiles.get(m.id) || makeTile(m.id);
      tiles.set(m.id, t);
      const mid = own.get(m.id) || speaker.get(m.id);
      const track = (mid && streamTracks.get(mid)) || null;
      if (t.track !== track) {
        t.track = track;
        t.video.srcObject = track ? new MediaStream([track]) : null;
      }
      t.name = m.name;
      // CSS order, not moving the element: a video taken out of the
      // page stops playing.
      t.el.style.order = m.id === large ? -1 : i;
      t.el.dataset.name = m.name;
      t.el.dataset.mid = mid || '';
      t.el.classList.toggle('large', m.id === large);
      t.el.classList.toggle('pinned', m.id === pinned);
      t.el.classList.toggle('speaking', !!m.speaking);
      t.el.classList.toggle('novideo', !track || !!m.paused);
      t.face.textContent = initials(m.name);
      const notes = [];
      if (m.host) notes.push('host');
      if (m.audio === 'muted') notes.push('muted');
      if (m.audio === 'held') notes.push('on hold');
      if (m.presenting) notes.push('presenting');
      if (m.paused && track) notes.push('paused');
      t.label.textContent = [m.name, ...notes].join(' · ');
      t.pin.textContent = m.id === pinned ? 'Unpin' : 'Pin';
    });
    for (const [id, t] of tiles) {
      if (!seen.has(id)) { t.el.remove(); tiles.delete(id); }
    }
  }

  // What the page shows, as the room's view (§2.3): the large one at 720
  // first, everyone else at the height their tiles have, no more than the
  // tracks this browser took.
  function viewOf(members, large) {
    const streams = [];
    if (large) streams.push({ participant: large, max_height: 720, priority: 1 });
    const rest = members.filter((m) => m.id !== large);
    const height = large ? 180 : rest.length <= 1 ? 720 : rest.length <= 4 ? 360 : 180;
    for (const m of rest) streams.push({ participant: m.id, max_height: height });
    const taken = streams.slice(0, STREAMS);
    return { streams: taken, max_streams: taken.length };
  }

  async function sendView() {
    if (!forwarding || !session) return;
    const members = others();
    if (!members.length) return;
    const view = viewOf(members, largeOne(members));
    const body = JSON.stringify(view);
    if (body === sentView) return;
    sentView = body;
    try {
      await call('POST', `/v1/rooms/${session.id}/view`, view, session.token);
      log(`view sent: ${body}`);
    } catch (e) {
      log(`view refused: ${e.message}`);
      // Sent again on a change, or the same view in a while: not every
      // second.
      setTimeout(() => { if (sentView === body) sentView = null; }, 5000);
    }
  }

  async function leave() {
    log('leaving');
    await cleanup(true);
  }

  async function cleanup(tellGateway) {
    if (poll) { clearInterval(poll); poll = null; }
    polling = 0;
    joined = null;
    if (tellGateway && session) {
      try { await call('DELETE', `/v1/rooms/${session.id}`, null, session.token); } catch (e) { log(`leave: ${e.message}`); }
    }
    if (screen) { screen.getTracks().forEach((t) => t.stop()); screen = null; }
    contentSender = null;
    if (pc) { pc.close(); pc = null; }
    if (local) { local.getTracks().forEach((t) => t.stop()); local = null; }
    $('self').srcObject = null;
    $('remote').srcObject = null;
    $('audio').srcObject = null;
    $('content').srcObject = null;
    forgetForwarding();
    $('videos').classList.remove('sharing');
    $('share').classList.add('hidden');
    $('share').textContent = 'Share screen';
    setStatus('share-status', '');
    session = null;
    $('call').classList.add('hidden');
    $('setup').classList.remove('hidden');
    $('join').disabled = false;
  }

  function toggleMute() {
    if (!local) return;
    const track = local.getAudioTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    $('mute').textContent = track.enabled ? 'Mute' : 'Unmute';
  }

  // Share a screen: the display track goes on the content section's
  // sender; the conference server takes the floor from the first packet
  // (or refuses, which the status shows). Stopping puts the track down.
  async function startSharing() {
    if (!pc || !contentSender || screen) return;
    try {
      screen = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 5 }, audio: false });
    } catch (e) {
      log(`getDisplayMedia: ${e.message}`);
      return;
    }
    const track = screen.getVideoTracks()[0];
    if ('contentHint' in track) track.contentHint = 'detail';
    // The browser's own "Stop sharing" bar ends the track.
    track.onended = () => stopSharing('stopped in the browser');
    try {
      noticesAtShare = noticesSeen;
      await contentSender.replaceTrack(track);
      $('share').textContent = 'Stop sharing';
      log('sharing the screen');
    } catch (e) {
      log(`sharing failed: ${e.message}`);
      screen.getTracks().forEach((t) => t.stop());
      screen = null;
    }
  }

  async function stopSharing(why) {
    if (!screen) return;
    log(`sharing stopped: ${why}`);
    screen.getTracks().forEach((t) => t.stop());
    screen = null;
    $('share').textContent = 'Share screen';
    if (contentSender) { try { await contentSender.replaceTrack(null); } catch (_) {} }
  }

  // A raised hand (docs/WEBINARS.md §2.5): sent to the room, and shown as
  // the session says it stands — a host lowers it, the stage takes it down.
  let handUp = false;
  function showHand(qa) {
    handUp = !!(qa && qa.hand);
    $('hand').textContent = handUp ? 'Lower hand' : 'Raise hand';
    $('hand').title = qa && qa.on_stage ? 'You are on the stage' : '';
  }
  async function toggleHand() {
    if (!session) return;
    try {
      await call('POST', `/v1/rooms/${session.id}/hand`, { raised: !handUp }, session.token);
      showHand({ hand: !handUp });
    } catch (e) {
      log(`hand: ${e.message}`);
    }
  }

  // Questions (docs/WEBINARS.md §2.5): as the room says this participant
  // sees them, kept by the gateway from the room's fcp-qa INFOs. Asking,
  // upvoting and a host's publish/answer/dismiss go to the room the same way.
  let questionsSeen = '';
  function showQuestions(qa) {
    const list = (qa && qa.questions) || [];
    $('qa').classList.toggle('hidden', !qa);
    const key = JSON.stringify([list, qa && qa.moderates]);
    if (key === questionsSeen) return;
    questionsSeen = key;
    const ol = $('questions');
    ol.replaceChildren();
    for (const q of list) {
      const li = document.createElement('li');
      const text = document.createElement('span');
      text.textContent = q.text;
      const meta = document.createElement('span');
      meta.className = 'meta';
      const notes = [q.asker || 'Anonymous', `${q.upvotes} ▲`];
      if (q.mine) notes.push('yours');
      if (!q.published) notes.push('not published');
      if (q.status === 'answered') notes.push(q.answered_live ? 'answered live' : 'answered');
      meta.textContent = ` — ${notes.join(' · ')}`;
      li.append(text, meta);
      const button = (label, op) => {
        const b = document.createElement('button');
        b.className = 'secondary';
        b.textContent = label;
        b.addEventListener('click', () => sendQuestion(op));
        li.append(b);
      };
      if (!q.mine) button(q.upvoted ? 'Unvote' : 'Upvote', { op: 'upvote', id: q.id, on: !q.upvoted });
      if (qa.moderates) {
        if (!q.published) button('Publish', { op: 'publish', id: q.id });
        button('Answered live', { op: 'answer', id: q.id, live: true });
        button('Dismiss', { op: 'dismiss', id: q.id });
      }
      if (q.answer) {
        const a = document.createElement('div');
        a.className = 'answer';
        a.textContent = q.answer;
        li.append(a);
      }
      ol.append(li);
    }
  }
  async function sendQuestion(message) {
    if (!session) return;
    try {
      await call('POST', `/v1/rooms/${session.id}/questions`, message, session.token);
      refresh();
    } catch (e) {
      log(`question: ${e.message}`);
    }
  }
  async function ask() {
    const text = $('question').value.trim();
    if (!text) return;
    await sendQuestion({ op: 'ask', text, anonymous: $('anonymous').checked });
    $('question').value = '';
  }
  // Chat (docs/WEBINARS.md §2.5): the messages this participant may see,
  // kept by the gateway from the room's fcp-chat INFOs. A host or panelist
  // deletes a message or mutes its sender the same way.
  let chatSeen = '';
  function showChat(chat, moderates) {
    const list = (chat && chat.messages) || [];
    $('chat').classList.toggle('hidden', !chat);
    $('message').disabled = !!(chat && chat.muted);
    $('message').placeholder = chat && chat.muted ? 'A host muted your chat' : 'Send a message';
    const key = JSON.stringify([list, moderates]);
    if (key === chatSeen) return;
    chatSeen = key;
    const ol = $('messages');
    ol.replaceChildren();
    for (const m of list) {
      const li = document.createElement('li');
      const meta = document.createElement('span');
      meta.className = 'meta';
      const who = m.mine ? 'You' : (m.sender || 'Someone');
      meta.textContent = `${who}${m.to === 'hosts' ? ' (to hosts)' : ''}: `;
      const text = document.createElement('span');
      text.textContent = m.text;
      li.append(meta, text);
      const button = (label, op) => {
        const b = document.createElement('button');
        b.className = 'secondary';
        b.textContent = label;
        b.addEventListener('click', () => sendChat(op));
        li.append(b);
      };
      if (moderates) {
        button('Delete', { op: 'delete', id: m.id });
        if (!m.mine && !m.sender_moderates) button('Mute', { op: 'mute', participant_id: m.sender_id, on: true });
      }
      ol.append(li);
    }
  }
  async function sendChat(message) {
    if (!session) return;
    try {
      await call('POST', `/v1/rooms/${session.id}/chat`, message, session.token);
      refresh();
    } catch (e) {
      log(`chat: ${e.message}`);
    }
  }
  async function send() {
    const text = $('message').value.trim();
    if (!text) return;
    await sendChat({ op: 'post', text, to: $('to').value });
    $('message').value = '';
  }
  $('send').addEventListener('click', send);
  $('message').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  $('ask').addEventListener('click', ask);
  $('question').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });

  $('join').addEventListener('click', join);
  $('hand').addEventListener('click', toggleHand);
  $('leave').addEventListener('click', leave);
  $('mute').addEventListener('click', toggleMute);
  $('share').addEventListener('click', () => (screen ? stopSharing('by you') : startSharing()));
  window.addEventListener('beforeunload', () => { if (session) navigator.sendBeacon && fetch(api + `/v1/rooms/${session.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${session.token}` }, keepalive: true }); });
  if (params.get('autojoin') === 'true' && $('room').value && $('token').value) join();
})();
</script>
</body>
</html>
