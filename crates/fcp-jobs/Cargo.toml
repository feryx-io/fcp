[package]
name = "fcp-jobs"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FCP Jobs - Async job processing service"

[[bin]]
name = "fcp-jobs"
path = "src/main.rs"

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-billing = { path = "../fcp-billing" }
fcp-cdr = { path = "../fcp-cdr" }
fcp-events = { path = "../fcp-events" }
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
fcp-storage-redis = { path = "../fcp-storage-redis", features = ["event-bus", "cdr"] }

# HTTP server for health checks
axum = { version = "0.7" }
tower-http = { version = "0.5", features = ["trace"] }

# Redis for job queue
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# CLI and configuration
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP client for webhook delivery
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"

[dev-dependencies]
async-trait = "0.1"
flate2 = "1"
fcp-testkit = { path = "../fcp-testkit" }
fcp-core = { path = "../fcp-core" }
redis = { version = "0.27", features = ["tokio-comp"] }
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
tempfile = "3"
uuid = { workspace = true }
