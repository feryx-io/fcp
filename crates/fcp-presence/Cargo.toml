[package]
name = "fcp-presence"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SIP Presence service for user availability tracking"

[dependencies]
fcp-core = { path = "../fcp-core" }
fcp-events = { path = "../fcp-events" }
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dashmap = "6"
uuid = { workspace = true }
quick-xml = { version = "0.37", features = ["serialize"] }
parking_lot = "0.12"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }
futures = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }
async-stream = { version = "0.3", optional = true }

[features]
default = []
redis = ["dep:redis", "dep:futures", "dep:tokio-stream", "dep:async-stream"]

[dev-dependencies]
futures = "0.3"
