[package]
name = "fcp-api-core"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core", features = ["openapi"] }
ipnetwork = "0.20"
fcp-sip = { path = "../fcp-sip" }
fcp-media = { path = "../fcp-media" }
fcp-pbx = { path = "../fcp-pbx" }
fcp-events = { path = "../fcp-events" }
fcp-policy = { path = "../fcp-policy" }
fcp-billing = { path = "../fcp-billing" }
fcp-flow = { path = "../fcp-flow" }
fcp-queue = { path = "../fcp-queue" }
fcp-presence = { path = "../fcp-presence", features = ["openapi"] }
fcp-webhooks = { path = "../fcp-webhooks" }

# REST API framework
axum = { version = "0.7", features = ["ws", "multipart"] }
# The OpenAPI contract (docs/DEVELOPER_SURFACE.md §3, phase 3)
utoipa = { version = "6", features = ["preserve_order", "preserve_path_order"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }

# Async runtime
tokio = { workspace = true }
futures-util = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# JWT / crypto for auth sessions
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
crc32fast = "1"
# ID tokens verified (docs/IDENTITY_AND_DEVICES.md phase 3): RS256 and ES256.
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
url = "2"
# SAML sign-in (docs/IDENTITY_AND_DEVICES.md phase 4), behind the `saml`
# feature: it verifies XML signatures through the xmlsec C library.
samael = { version = "0.0.22", optional = true }
openssl = { version = "0.10", optional = true }
flate2 = { version = "1", optional = true }
quick-xml = { version = "0.41", optional = true }
base64 = "0.22"
md5 = "0.7"
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client (for proxying to events server)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
urlencoding = "2"
serde_urlencoded = "0.7"

# Secure random for token generation
rand = "0.8"

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
regex = "1"
async-trait = "0.1"

[features]
# SAML 2.0 sign-in through tenants' identity providers: needs libxmlsec1
# (the images carry it; docs/SSO.md says how to build with it).
saml = ["dep:samael", "dep:openssl", "dep:flate2", "dep:quick-xml"]

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
# Every response the Postgres suite sees is checked against the OpenAPI
# contract (docs/DEVELOPER_SURFACE.md §3, phase 3).
jsonschema = { version = "0.58", default-features = false }
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
tower = { version = "0.5", features = ["util"] }
# Handler tests against a real PostgreSQL instance (tests/api_postgres.rs)
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
# A local master key, for the encryption-at-rest routes
fcp-crypto = { path = "../fcp-crypto" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
bytes = { workspace = true }
# WebSocket client for the /api/v1/events first-message auth test (matches axum 0.7's tungstenite)
tokio-tungstenite = "0.21"
tempfile = "3"
