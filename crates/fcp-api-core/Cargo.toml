[package]
name = "fcp-api-core"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# FCP crates
fcp-core = { path = "../fcp-core" }
fcp-sip = { path = "../fcp-sip" }
fcp-media = { path = "../fcp-media" }
fcp-events = { path = "../fcp-events" }
fcp-billing = { path = "../fcp-billing" }
fcp-flow = { path = "../fcp-flow" }
fcp-queue = { path = "../fcp-queue" }
fcp-presence = { path = "../fcp-presence" }

# REST API framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { workspace = true }
futures-util = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# JWT / crypto for auth sessions
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# HTTP client (for proxying to events server)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
urlencoding = "2"

# Secure random for token generation
rand = "0.8"

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[dev-dependencies]
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
# Handler tests against a real PostgreSQL instance (tests/api_postgres.rs)
fcp-storage-postgres = { path = "../fcp-storage-postgres" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
bytes = { workspace = true }
# WebSocket client for the /api/v1/events first-message auth test (matches axum 0.7's tungstenite)
tokio-tungstenite = "0.21"
tempfile = "3"
