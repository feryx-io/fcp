[package]
name = "fcp-sbc-core"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# FCP dependencies
fcp-core = { path = "../fcp-core" }
fcp-b2bua-core = { path = "../fcp-b2bua-core" }
fcp-cdr = { path = "../fcp-cdr" }
fcp-sip = { path = "../fcp-sip" }
fcp-events = { path = "../fcp-events" }

# SIP stack dependencies (from siphon-rs)
sip-core = { path = "../../external/siphon-rs/crates/sip-core" }
sip-uac = { path = "../../external/siphon-rs/crates/sip-uac" }
sip-dns = { path = "../../external/siphon-rs/crates/sip-dns" }

# STIR/SHAKEN (PASSporT signing/verification)
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
base64 = "0.22"
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true

# IP network parsing
ipnetwork = "0.20"

# Runtime infrastructure
dashmap = "6"
async-trait = "0.1"
rand = "0.8"
tokio = { workspace = true }

[dev-dependencies]
toml = "0.8"
tokio = { workspace = true, features = ["test-util"] }
