[service]
service_type = "conference"
node_id = "conference-local"

[sip]
# Siblings on this host reach each other over loopback; they carry many
# parties' traffic, so the per-source message limit
# (max_messages_per_source, default 200 a second) does not apply to them.
trusted_sources = ["127.0.0.0/8"]
udp_bind = "0.0.0.0:5074"
tcp_bind = "0.0.0.0:5074"
local_ip = "192.168.1.225"
local_uri = "sip:conference@192.168.1.225:5074"

[storage]
database_url = "postgresql://fcp:fcp_password@localhost:5432/fcp"
redis_url = "redis://localhost:6379"

[http]
bind_address = "0.0.0.0:8090"
auth_enabled = true
auth_token = "svc-local-secret"

[media]
rtp_port_start = 26000
rtp_port_end = 27999
public_ip = "192.168.1.225"
codecs = ["PCMU", "PCMA"]

[events]
server_url = "http://localhost:8081/ingest"
auth_token = "events-local-secret"

[conference]
# Where video rooms run: "host" (default), or a GPU as "cuda:0" — a build
# with the `video-hwaccel` feature and the NVIDIA driver (docs/GPU.md).
# video_device = "host"
# Browser join tokens (the admin API's [conference] join_secret).
join_secret = "join-local-secret"
sample_rate = 8000
frame_size = 160
enable_vad = true
auto_destroy_empty_rooms = true
recordings_dir = "/tmp/fcp/conference/recordings"
# What a room is recorded to (docs/VIDEO_CONFERENCING.md §11):
#   auto — WebM (composite video + Opus) when the meeting has video and
#          this node can encode VP8/VP9 for it, WAV otherwise
#   wav  — mixed audio only, as conference recordings have always been
#   webm — always WebM
# WebM needs the `recording-webm` build feature; without it every
# recording is a WAV and the node says so at startup.
recording_format = "auto"
# recording_video_codec = "vp8"       # or "vp9"
# recording_resolution = "720p"       # the room's own by default, and the cap
# recording_audio_bitrate = 64000
# How long this node keeps a recording when its tenant has set no
# retention policy of its own (0 or unset: keep until asked).
# recording_retention_days = 90
announcements_dir = "/tmp/fcp/conference/announcements"
jitter_buffer_ms = 60
dtmf_enabled = true
max_pin_attempts = 3
pin_timeout_secs = 15
# Sound files are resolved from the Prompt store (Audio Prompts page).
# Uncomment below to use static WAV files instead:
# pin_prompt_sound = "pin_prompt.wav"
# invalid_pin_sound = "invalid_pin.wav"
# moh_sound = "moh.wav"

[tts]
enabled = true
provider = "local"
engine = "kokoro"
python_path = ".venv/bin/python3"
cache_dir = "/tmp/fcp/tts_cache"
voice = "af_heart"

[logging]
level = "info"
format = "pretty"

[cluster]
# How often a node tells the peers hosting a room who is speaking on it,
# so every node runs the same active-speaker rule over the same inputs
# (docs/DISTRIBUTED_CONFERENCING.md). 0 turns cross-node agreement off.
# speaker_interval_ms = 400
enabled = true
heartbeat_interval_secs = 5
heartbeat_ttl_secs = 15
