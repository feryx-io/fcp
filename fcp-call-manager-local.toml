[service]
service_type = "call_manager"
node_id = "cm-local-01"

[sip]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"

[registrar]
auth_enabled = true
realm = "fcp.local"

[storage]
database_url = "postgresql://fcp:fcp_password@localhost:5432/fcp"
redis_url = "redis://localhost:6379"

[http]
bind_address = "0.0.0.0:8084"
api_token = "svc-local-secret"

[media]
rtp_port_start = 20000
rtp_port_end = 30000
tts_engine = "kokoro"
tts_voice = "af_heart"
tts_cache_dir = "/tmp/fcp/tts_cache"
tts_python = ".venv/bin/python3"
prompts_dir = "/tmp/fcp/audio/prompts"

[b2bua]
voicemail_server_uri = "sip:voicemail@192.168.1.225:5072"
conference_server_uri = "sip:conference@192.168.1.225:5074"

[events]
server_url = "http://localhost:8081/ingest"
auth_token = "events-local-secret"

[logging]
level = "info"
format = "pretty"

[presence]
enabled = true

[cluster]
enabled = true
heartbeat_interval_secs = 5
heartbeat_ttl_secs = 15
