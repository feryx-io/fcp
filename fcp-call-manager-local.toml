[service]
service_type = "call_manager"
node_id = "cm-local-01"

[sip]
# Siblings on this host reach each other over loopback; they carry many
# parties' traffic, so the per-source message limit
# (max_messages_per_source, default 200 a second) does not apply to them.
trusted_sources = ["127.0.0.0/8"]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"

[registrar]
auth_enabled = true
realm = "fcp.local"

[storage]
database_url = "postgresql://fcp:fcp_password@localhost:5432/fcp"
redis_url = "redis://localhost:6379"

# CDR spool (docs/CDR_PIPELINE.md); data/ is git-ignored.
[cdr]
spool_dir = "data/cdr-spool"

[http]
bind_address = "0.0.0.0:8084"
api_token = "svc-local-secret"

[media]
# 20000-21999: the other local services take 22000-36000 (docs/SINGLE-NODE-SETUP.md).
rtp_port_start = 20000
rtp_port_end = 21999
tts_remote_url = "http://localhost:8093"
tts_remote_token = "tts-local-secret"
tts_voice = "af_heart"
tts_cache_dir = "/tmp/fcp/tts_cache"
prompts_dir = "/tmp/fcp/audio/prompts"

[b2bua]
voicemail_server_uri = "sip:voicemail@192.168.1.225:5072"
conference_server_uri = "sip:conference@192.168.1.225:5074"

[events]
server_url = "http://localhost:8081/ingest"
auth_token = "events-local-secret"

[logging]
level = "info"
format = "pretty"

[presence]
enabled = true

[cluster]
enabled = true
heartbeat_interval_secs = 5
heartbeat_ttl_secs = 15

# Every binary of the single-node setup runs on this machine, and the ones
# that INVITE this node (the WebRTC gateway, the conference, voicemail and
# IVR servers) do it from loopback with no user's password: trusted, as
# `[registrar] auth_invites` (on by default) challenges everything else
# (docs/EDGE_SECURITY.md §2.1).
[e911]
trusted_edges = ["127.0.0.0/8"]
