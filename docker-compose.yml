version: '3.8'

services:
  # FCP Server - Main PBX application
  fcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fcp-server
    hostname: fcp.local
    restart: unless-stopped
    ports:
      - "5060:5060/udp"  # SIP UDP
      - "5060:5060/tcp"  # SIP TCP
      - "5061:5061/tcp"  # SIP TLS
      - "8084:8084"      # REST API
      - "10000-11000:10000-11000/udp"  # RTP media ports (1000 ports = 500 calls)
    environment:
      - RUST_LOG=info
      - FCP_CALL_MANAGER_LOG_FORMAT=json
      - FCP_CALL_MANAGER_CONFIG=/etc/fcp/fcp.toml
      - FCP_CALL_MANAGER_PUBLIC_IP=192.168.1.225
    volumes:
      - fcp-data:/var/lib/fcp
      - fcp-config:/etc/fcp
      - fcp-logs:/var/log/fcp
      - ./config/fcp-docker.toml:/etc/fcp/fcp.toml:ro
      - shared-data:/home/fcp/data  # Shared database
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fcp-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fcp
      - POSTGRES_USER=fcp
      - POSTGRES_PASSWORD=fcp_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fcp-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - fcp-network
    depends_on:
      - fcp-server

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fcp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - fcp-network
    depends_on:
      - prometheus

  # Redis - For distributed state (Phase 3)
  # Commented out for Phase 1, uncomment when clustering is enabled
  # redis:
  #   image: redis:7-alpine
  #   container_name: fcp-redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - fcp-network

networks:
  fcp-network:
    driver: bridge

volumes:
  fcp-data:
    driver: local
  fcp-config:
    driver: local
  fcp-logs:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  shared-data:
    driver: local
  # redis-data:
  #   driver: local
