# The Redis cluster membership uses: a top-level key, not under [cluster].
redis_url = "redis://localhost:6379"

[cluster]
enabled = true
heartbeat_interval_secs = 5
heartbeat_ttl_secs = 15

[core]
external_domain = "fcp.local"

[core.security]
# Siblings on this host reach each other over loopback; they carry many
# parties' traffic, so the per-source message limit
# (max_messages_per_source, default 200 a second) does not apply to them.
trusted_sources = ["127.0.0.0/8"]
max_message_size = 65535

[core.admission]
max_cps = 100
max_concurrent_calls = 500

[core.nat]
external_ip = "192.168.1.225"
rtp_port_start = 28000
rtp_port_end = 29999
enable_transcoding = true
enable_dtmf = true

[core.storage]
enabled = true
database_url = "postgresql://fcp:fcp_password@localhost:5432/fcp"

[core.metrics]
snapshot_interval_secs = 30
