# FCP Server Configuration

[node]
name = "fcp-node"
local_domain = "fcp.local"

[transport]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"
max_message_size = 65535
connection_pool_size = 1000
connection_timeout = { secs = 300, nanos = 0 }
enable_sdp = true
local_ip = "192.168.1.81"
rtp_port = 10000

[storage]
backend = "sqlite"
connection_string = "sqlite://fcp.db"
max_connections = 10
connection_timeout = { secs = 30, nanos = 0 }

[registrar]
enabled = true
auth_enabled = false
realm = "fcp.local"
data_dir = "/tmp/fcp-data"
users_file = "examples/users.json"
default_expires = 3600
min_expires = 60
max_expires = 86400

[routing]
enabled = false
default_tenant_id = "default"

[routing.backend]
type = "yaml"
path = "examples/routing.yaml"
watch = true

[api]
enabled = true
bind = "127.0.0.1:8080"
metrics_enabled = true
metrics_path = "/metrics"
auth_enabled = false

[observability]
log_level = "info"
log_format = "pretty"
tracing_enabled = false
service_name = "fcp"
