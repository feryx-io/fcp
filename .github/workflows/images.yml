# The shipped stack, built, published and run (docs/NIGHTLY_STACK.md phase
# 2). Every night: the fifteen images are built one to a runner and
# pushed to ghcr.io/thevoiceguy/fcp-<name> as `nightly` and as the commit
# sha; then one runner pulls them, brings the stack up with the shipped
# .env, carries a call through it with the testkit's phone, backs it up,
# drops it, restores it and calls again. What the stack test over the
# binaries cannot see — each image's entrypoint and filesystem,
# depends_on and the health checks, the certs service as a container,
# host networking, the proxy, the scripts against real volumes — is seen
# here. Operators pull the same images: FCP_IMAGE_TAG=nightly in .env,
# `docker compose pull`, `up -d --no-build`.
name: Images

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Run the stack job alone, against images already pushed under this tag (a sha or `nightly`); blank builds and pushes first
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: thevoiceguy
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build:
    name: ${{ matrix.image }}
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - admin
          - gateway
          - events
          - call-manager
          - conference
          - webrtc-gw
          - media
          - jobs
          - registrar
          - sbc
          - ivr
          - voicemail
          - presence
          - tts
          - link
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          docker build -f deploy/docker-compose/Dockerfile.${{ matrix.image }} \
            -t "$REGISTRY/$OWNER/fcp-${{ matrix.image }}:${{ github.sha }}" \
            -t "$REGISTRY/$OWNER/fcp-${{ matrix.image }}:nightly" .
      # `nightly` is what operators pull, so only main moves it; a run
      # dispatched on a branch pushes its sha alone and is still run by the
      # stack job below.
      - name: Push
        run: |
          docker push "$REGISTRY/$OWNER/fcp-${{ matrix.image }}:${{ github.sha }}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker push "$REGISTRY/$OWNER/fcp-${{ matrix.image }}:nightly"
          fi

  stack:
    name: The stack, live
    needs: build
    # After the build, or alone against a tag already pushed.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: deploy/docker-compose
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: images-stack
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The shipped .env, with this runner's address (what the phone's SDP
      # names) and the images this run built.
      - name: This runner's .env
        run: |
          ip=$(hostname -I | awk '{print $1}')
          sed -i "s/^HOST_IP=.*/HOST_IP=$ip/; s/^FCP_IMAGE_TAG=.*/FCP_IMAGE_TAG=$IMAGE_TAG/" .env
          grep -E '^(HOST_IP|FCP_IMAGE_TAG)=' .env
          docker compose config --quiet
      - name: Pull and start the stack
        run: |
          docker compose pull --quiet
          docker compose up -d --no-build
          scripts/wait-healthy.sh 300
      # The CA the certs service made: the phone registers over SIPS with it.
      - name: The stack's CA
        run: docker run --rm -v docker-compose_fcp-certs:/certs:ro alpine:3.20 cat /certs/ca.crt > "$RUNNER_TEMP/ca.crt"
      # The test binary, built once while the stack settles; the call itself
      # is quick.
      - name: A call through the fresh stack
        working-directory: .
        env:
          FCP_LIVE_STACK: fresh
          FCP_LIVE_CA: ${{ runner.temp }}/ca.crt
        run: cargo test -p fcp-call-manager --test compose_live -- --nocapture
      - name: Back up, drop, restore
        run: |
          scripts/backup.sh "$RUNNER_TEMP/backup"
          cat "$RUNNER_TEMP/backup/manifest"
          docker compose down -v
          scripts/restore.sh "$RUNNER_TEMP/backup" --no-up
          docker compose up -d --no-build
          scripts/wait-healthy.sh 300
      - name: A call through the restored stack
        working-directory: .
        env:
          FCP_LIVE_STACK: restored
          FCP_LIVE_CA: ${{ runner.temp }}/ca.crt
        run: cargo test -p fcp-call-manager --test compose_live -- --nocapture
      # A site against this cloud (docs/SITE_SETUP.md, hybrid phase 7):
      # the live tenant gets a site through the admin API, and the site
      # stack — its own Postgres, Redis, admin, call manager and link —
      # comes up beside the cloud stack as a second compose project from
      # the same images, its .env holding the site's token and this
      # runner's addresses for the cloud, its cloud-ca.crt the CA above.
      - name: A site for the live tenant
        id: site
        run: |
          ip=$(hostname -I | awk '{print $1}')
          admin_token=$(grep '^FCP_ADMIN_AUTH_TOKEN=' .env | cut -d= -f2-)
          tenant=$(curl -fsS -H "Authorization: Bearer $admin_token" http://127.0.0.1:8080/api/v1/tenants \
            | jq -r 'if type == "array" then . else .data end | .[] | select(.name == "live") | .id')
          test -n "$tenant"
          site=$(curl -fsS -X POST -H "Authorization: Bearer $admin_token" -H "x-fcp-tenant-id: $tenant" \
            -H 'Content-Type: application/json' -d '{"name":"live-site"}' http://127.0.0.1:8080/api/v1/sites)
          site_id=$(echo "$site" | jq -r .id)
          token=$(echo "$site" | jq -r .enrollment_token)
          test -n "$site_id" && test -n "$token"
          echo "site_id=$site_id" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/ca.crt" site/cloud-ca.crt
          sed -i "s/^HOST_IP=.*/HOST_IP=$ip/; s/^FCP_IMAGE_TAG=.*/FCP_IMAGE_TAG=$IMAGE_TAG/; \
            s#^FCP_LINK_CLOUD_URL=.*#FCP_LINK_CLOUD_URL=https://$ip:8446#; \
            s#^FCP_LINK_LINK_URL=.*#FCP_LINK_LINK_URL=https://$ip:8447#; \
            s#^FCP_CLOUD_ADMIN_URL=.*#FCP_CLOUD_ADMIN_URL=https://$ip:8444#; \
            s/^FCP_LINK_ENROLLMENT_TOKEN=.*/FCP_LINK_ENROLLMENT_TOKEN=$token/" site/.env
          grep -E '^(HOST_IP|FCP_IMAGE_TAG|FCP_LINK_CLOUD_URL|FCP_LINK_LINK_URL|FCP_CLOUD_ADMIN_URL)=' site/.env
          echo "site $site_id for tenant $tenant"
      - name: Pull and start the site
        working-directory: deploy/docker-compose/site
        run: |
          docker compose config --quiet
          docker compose pull --quiet
          docker compose up -d --no-build
          COMPOSE_DIR=$PWD ../scripts/wait-healthy.sh 300
      # The site enrolled and in step: the link up on the cloud's site
      # record with the site's call manager on it, a user made in the
      # cloud registering at the site, the site bound at the cloud's SBC,
      # the site's admin refusing what the cloud owns.
      - name: The site, enrolled and in step
        working-directory: .
        env:
          FCP_LIVE_SITE: ${{ steps.site.outputs.site_id }}
          FCP_LIVE_CA: ${{ runner.temp }}/ca.crt
        run: cargo test -p fcp-link --test compose_site -- --nocapture
      # The site is kept the way the cloud is: the same script, pointed
      # at the site's project, takes its dump, its key and its link.
      - name: Back up the site
        run: |
          COMPOSE_DIR=$PWD/site scripts/backup.sh "$RUNNER_TEMP/site-backup"
          cat "$RUNNER_TEMP/site-backup/manifest"
          grep -q 'link-data' "$RUNNER_TEMP/site-backup/manifest"
      - name: The stack's logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color > "$RUNNER_TEMP/stack.log" 2>&1 || true
          if [ -f site/cloud-ca.crt ]; then
            (cd site && docker compose ps && docker compose logs --no-color > "$RUNNER_TEMP/site.log" 2>&1) || true
          fi
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: |
            ${{ runner.temp }}/stack.log
            ${{ runner.temp }}/site.log
          if-no-files-found: ignore
      - name: Down
        if: always()
        run: |
          if [ -f site/cloud-ca.crt ]; then (cd site && docker compose down -v) || true; fi
          docker compose down -v

  # A failed scheduled run opens an issue, or comments on the one open, and
  # a passing one closes it (docs/DEEP_TESTING.md D0, Q8): the live stack failed
  # for nights before anyone looked.
  report:
    name: Report the scheduled run
    needs: [build, stack]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/scheduled-run-report.sh
