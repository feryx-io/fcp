# Every image the compose stack builds, built nightly from main
# (docs/SHIP_AND_OPERATE.md phase 3): a Dockerfile that no longer builds
# is found by this run rather than by an operator. Not on pull requests —
# nine Rust release builds are too long for one — but `workflow_dispatch`
# builds a branch by hand.
name: Images

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - admin
          - gateway
          - events
          - call-manager
          - conference
          - webrtc-gw
          - media
          - jobs
          - registrar
          - sbc
          - ivr
          - voicemail
          - presence
          - tts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Build
        run: docker build -f deploy/docker-compose/Dockerfile.${{ matrix.image }} -t fcp-${{ matrix.image }}:nightly .
