name: CI

# Pull requests, plus a weekly run on main. A push to main is the squash of a
# PR that just passed this same workflow, so re-running all of it there doubled
# the bill for no new signal (43 of 106 runs in the first week of September
# 2026); drafts and `docs:` PRs are skipped for the same reason (see the test
# job's `if`).
#
# The weekly run is not there for its result; it is there to write a cache.
# GitHub scopes an Actions cache to the ref that wrote it. A cache written by a
# pull-request run is readable only by that same pull request, while one written
# on the default branch is readable by every branch -- so main is the only ref
# whose caches help the *next* pull request.
#
# Removing the push-on-main trigger therefore stopped anything from ever
# refreshing that cache. Checked on 2026-09-09: main still held four ~620 MB
# `rust-cache` entries, and every one of them was written on 2026-09-07, by the
# last push-on-main runs before the trigger went. Pull requests have been living
# off those frozen entries since. It works -- a stale restore is most of a warm
# one, because the registry dependencies it carries rarely change -- but it
# degrades as main moves away from them, and it ends the first time a quiet week
# lets them pass the 7-day eviction window with nothing to recreate them. A cold
# run is ~22 minutes against ~13 warm.
#
# The compiling is the cost either way: a fresh `actions/checkout` gives every
# source file a new mtime, and cargo fingerprints path dependencies by mtime, so
# all 73 workspace and submodule crates rebuild even when the registry
# dependencies restore correctly. Thirteen minutes a week is the cheap way to
# keep a current cache on main and never find out what a cold week costs.
#
# sccache was tried here first and reverted. It saved ~94 seconds of the test
# step within a single pull request, but its entries are ref-scoped like any
# other, so they helped no other branch -- and 466 of them filled the
# repository's entire 10 GB cache budget in one run, evicting the caches that
# were working.
on:
  pull_request:
    branches: [main]
    # `ready_for_review` is here because the test job skips drafts (see its
    # `if` below); without it, marking a draft ready would never start CI.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Monday 09:00 UTC: a weekly advisory sweep of main's Cargo.lock, and the
    # run that leaves a warm cache under `refs/heads/main` for the week's
    # pull requests (see the note above).
    - cron: '0 9 * * 1'
  workflow_dispatch:

# A new push to a PR makes the run in progress obsolete; cancel it instead of
# paying for both. Scheduled and manual runs share no ref with a PR, so they
# are never cancelled by one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is never inspected in CI and roughly triples the size of the
  # target directory; the hosted runners run out of disk without this.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    # Two kinds of pull request cost ~13 minutes and tell us nothing:
    #
    #   * a draft, which is still being pushed to; and
    #   * a `docs:` one, which by this repo's convention changes Markdown plus
    #     the version line every commit bumps in Cargo.toml and Cargo.lock.
    #     That version bump is why `paths-ignore` cannot express this — a
    #     docs-only PR always touches those two files.
    #
    # Everything that is not a pull request runs: the weekly schedule, whose
    # real job is to leave a warm cache on main, and `workflow_dispatch`, which
    # is the way to build a draft or a `docs:` PR by hand from the Actions tab.
    if: >-
      github.event_name != 'pull_request'
      || (!github.event.pull_request.draft
          && !startsWith(github.event.pull_request.title, 'docs:'))
    runs-on: ubuntu-latest
    # Real PostgreSQL for the database-backed suites (fcp-storage-postgres,
    # fcp-api-core, and the per-binary smoke tests). They create and drop a
    # throwaway database per test, so the service only needs a superuser and
    # the default `postgres` database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis for the fcp-jobs smoke test (crates/fcp-jobs/tests/smoke.rs);
      # everything else treats Redis as optional.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FCP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      FCP_TEST_REDIS_URL: redis://localhost:6379
      FCP_PG_PAIR_TESTS: required
    steps:
      # The hosted runner leaves ~14GB free, which a 32-crate workspace's
      # debug + test artifacts overflow (the run dies with SIGBUS in ld /
      # "No space left on device"). Drop the large preinstalled toolchains
      # we never use to reclaim ~20GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      # The workspace path-depends on external/siphon-rs and external/forge-media,
      # so the submodules must be present or dependency resolution fails outright.
      # Both submodule repos are public, so the default GITHUB_TOKEN suffices.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # `--all-features` turns on fcp-conference-server's `video-*` features,
      # which link the native video codecs (libvpx, dav1d, OpenH264 built from
      # source, SVT-AV1), and `video-hwaccel`, whose FFmpeg bindings need the
      # libav* development headers. forge-media's composite action installs
      # them all the way its own CI does.
      - name: Install native video codec libraries
        uses: ./external/forge-media/.github/actions/video-codecs
      # SAML sign-in (`fcp-api-core/saml`, docs/SSO.md) verifies XML
      # signatures through xmlsec; samael generates its bindings with
      # libclang.
      - name: Install xmlsec for SAML
        run: sudo apt-get update && sudo apt-get install -y libxmlsec1-dev libclang-dev
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # On a pull request this restores; on the weekly run on main it is what
      # writes the cache every branch then reads, since Actions caches are
      # readable from the ref that wrote them and from the default branch.
      # `save-if` is left at its default so both do save: within one pull
      # request the second and later runs want the first one's work too.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
      # `cargo fmt --all` also reformats the path dependencies under external/, which are
      # separately maintained submodules with their own CI. Scope the check to the
      # workspace members so FCP's CI does not police siphon-rs / forge-media style.
      - name: Format
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name | "-p \(.)"' | tr '\n' ' ')
          cargo fmt $pkgs -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # `recording-webm` and `recording-mp4` are off by default (they build
      # libopus from source), so the conference server's recording tests
      # only run when asked for by name; the MP4 one needs real H.264
      # frames, so `video-openh264` comes along (the codec action above
      # built it).
      # The restore test (crates/fcp-call-manager/tests/compose_restore.rs)
      # dumps and restores with the client tools, which must be the
      # service container's major version or newer; the runner image ships
      # PostgreSQL 16's, the same as `postgres:16`, and this is for the
      # day it does not.
      - name: Postgres client tools for the restore test
        run: |
          command -v pg_dump >/dev/null || sudo apt-get install -y postgresql-client
          pg_dump --version
      # The primary failed over to its standby (crates/fcp-call-manager/
      # tests/faults.rs, docs/DEEP_TESTING.md D5c) runs a pair of Postgres
      # servers of its own (fcp_testkit::pg_pair): the runner image ships
      # the server, unstarted, under /usr/lib/postgresql/<major>/bin.
      # FCP_PG_PAIR_TESTS=required makes its absence a failure.
      - name: Postgres server binaries for the failover test
        run: |
          ls /usr/lib/postgresql/*/bin/pg_basebackup 2>/dev/null || sudo apt-get install -y postgresql
          ls /usr/lib/postgresql/*/bin/initdb
      # The SDKs' own suites run against a live admin from
      # crates/fcp-admin/tests/sdks.rs (docs/DEVELOPER_SURFACE.md §3,
      # phase 4): Node and the TypeScript SDK's dependencies, and uv for
      # the Python SDK, must be here, and FCP_SDK_TESTS=required makes their
      # absence a failure rather than a skip.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: The TypeScript SDK's dependencies
        working-directory: sdk/typescript
        run: npm ci
      - uses: astral-sh/setup-uv@v6
      # SIPp, a SIP implementation that is not ours, for
      # crates/fcp-call-manager/tests/sipp.rs and crates/fcp-sbc/tests/sipp.rs
      # (docs/DEEP_TESTING.md D2);
      # FCP_SIPP_TESTS=required makes its absence a failure, not a skip.
      # baresip, a softphone that is not ours with real media, for
      # crates/fcp-call-manager/tests/baresip.rs and the conference room in
      # rooms.rs (docs/DEEP_TESTING.md D2d); FCP_BARESIP_TESTS=required too.
      - name: SIPp and baresip
        run: |
          sudo apt-get install -y sip-tester baresip-core
          sipp -v | head -2
          baresip -h 2>&1 | head -1
          ls /usr/lib/baresip/modules | tr '\n' ' '
          echo "FCP_BARESIP_MODULES=/usr/lib/baresip/modules" >> "$GITHUB_ENV"
      # Every request that reaches an /api/v1 route, in this test process or
      # an admin binary a test starts, is logged to FCP_ROUTE_LOG
      # (fcp_api_core::route_log) for the step after.
      - name: Tests
        env:
          FCP_SDK_TESTS: required
          FCP_SIPP_TESTS: required
          FCP_BARESIP_TESTS: required
          FCP_ROUTE_LOG: ${{ runner.temp }}/routes.log
        run: cargo test --all-targets --features fcp-conference-server/recording-webm,fcp-conference-server/recording-mp4,fcp-conference-server/video-openh264,fcp-api-core/saml
      # docs/DEEP_TESTING.md D1: every operation in the contract is called
      # by a test, or listed in scripts/routes-uncalled.txt with a reason.
      - name: Every operation is called
        run: scripts/check-routes-called.py "$RUNNER_TEMP/routes.log"

  # The packaging: the compose file, alone and with the GPU overlay, must
  # be a valid stack with the shipped .env (docs/SHIP_AND_OPERATE.md phase
  # 3). Cheap, so it runs on every pull request including drafts; the
  # images themselves are built nightly (.github/workflows/images.yml).
  # The submodules' nightly fuzzing (docs/NIGHTLY_STACK.md phase 1): FCP
  # relies on siphon-rs and forge-media fuzzing their parsers every night,
  # and their runs were red for two weeks before anyone looked. On the
  # weekly run (and by hand), the latest completed Fuzz run of each must
  # have succeeded and be less than two days old.
  submodule-nightlies:
    name: Submodule nightlies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The latest fuzz run of each submodule is green and recent
        run: |
          set -eo pipefail
          failed=""
          for repo in thevoiceguy/siphon-rs thevoiceguy/forge-media; do
            run=$(gh api "repos/$repo/actions/workflows/fuzz.yml/runs?status=completed&per_page=1" \
              --jq '.workflow_runs[0] | "\(.conclusion) \(.created_at) \(.html_url)"')
            set -- $run
            conclusion=$1; created=$2; url=$3
            age_hours=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 3600 ))
            echo "$repo: $conclusion, ${age_hours}h ago — $url"
            if [ "$conclusion" != "success" ] || [ "$age_hours" -ge 48 ]; then
              failed="$failed $repo"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::a submodule's fuzzing is red or stale:$failed"
            exit 1
          fi

  sdks:
    name: SDKs
    # The SDKs' generated code is what docs/openapi.json makes
    # (docs/DEVELOPER_SURFACE.md §3, phase 4); their tests against a live
    # admin run in the test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: The TypeScript SDK's schema is the contract's
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run -s gen
          git diff --exit-code src/schema.ts \
            || { echo "::error::sdk/typescript/src/schema.ts is stale: run npm run gen"; exit 1; }
          npm run -s build
      - name: The Python SDK's client is the contract's
        working-directory: sdk/python
        run: |
          uvx openapi-python-client@0.29.1 generate --path ../../docs/openapi.json \
            --meta none --output-path fcp_api --overwrite --config openapi-python-client.yaml
          if [ -n "$(git status --porcelain fcp_api)" ]; then
            git status --short fcp_api | head
            echo "::error::sdk/python/fcp_api is stale: regenerate it (README.md)"
            exit 1
          fi
      - name: The SDKs' versions follow the release
        run: |
          release=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2 | cut -d. -f1,2)
          ts=$(jq -r .version sdk/typescript/package.json | cut -d. -f1,2)
          py=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2 | cut -d. -f1,2)
          test "$ts" = "$release" && test "$py" = "$release" \
            || { echo "::error::SDK versions $ts/$py do not follow the release $release"; exit 1; }

  admin-ui:
    name: Admin UI
    # The UI's types are generated from the API's OpenAPI contract
    # (docs/DEVELOPER_SURFACE.md §3, phase 3b): the generated file must be
    # what docs/openapi.json makes, and the UI must typecheck against it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/fcp-admin-ui/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/fcp-admin-ui/ui/package-lock.json
      - name: Install
        run: npm ci
      - name: The generated API types are the contract's
        run: |
          npm run -s gen:api
          git diff --exit-code src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is stale: run npm run gen:api"; exit 1; }
      - name: Typecheck
        run: npx tsc -b

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The compose stack resolves
        working-directory: deploy/docker-compose
        run: docker compose config --quiet
      - name: The compose stack resolves with the GPU overlay
        working-directory: deploy/docker-compose
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: The compose stack resolves with the registrar profile
        working-directory: deploy/docker-compose
        run: docker compose --profile registrar config --quiet
      - name: The compose stack resolves with the tts profile
        working-directory: deploy/docker-compose
        run: docker compose --profile tts config --quiet
      - name: The site stack resolves
        working-directory: deploy/docker-compose/site
        run: docker compose config --quiet
      - name: The test scripts parse
        run: bash -n deploy/docker-compose/scripts/*.sh
      # A new migration may add but not take away what the previous
      # release still reads (docs/BACKUP_AND_RESTORE.md §5): the check
      # proves itself against a drop and an add, then reads every
      # migration above 077.
      - name: The migration discipline
        run: |
          scripts/check-migrations.sh --self-test
          scripts/check-migrations.sh

  security-audit:
    name: Security Audit
    # Cheap enough (~20s) to keep running on `docs:` PRs, which do change
    # Cargo.lock; drafts are still skipped along with the test job.
    if: >-
      github.event_name != 'pull_request'
      || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # cargo-audit reads the committed Cargo.lock, so this job does not need
      # the submodules.
      - uses: actions/checkout@v5
      # A prebuilt binary: `cargo install` compiled cargo-audit from source on
      # every run, 5.6 of the job's 5.7 minutes, to run a 5-second check.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        run: cargo audit
      - name: Run cargo-audit with JSON output
        if: always()
        run: cargo audit --json > audit-report.json || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json

  # A failed scheduled run opens an issue, or comments on the one open, and
  # a passing one closes it (docs/DEEP_TESTING.md D0, Q8): the security audit failed
  # for nights before anyone looked.
  report:
    name: Report the scheduled run
    needs: [test, submodule-nightlies, sdks, admin-ui, packaging, security-audit]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/scheduled-run-report.sh
