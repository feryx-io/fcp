name: CI

# Pull requests only, and only the ones that can produce a signal. A push to
# main is the squash of a PR that just passed this same workflow, so re-running
# it there doubled the bill for no new signal (43 of 106 runs in the first week
# of September 2026); drafts and `docs:` PRs are skipped for the same reason
# (see the test job's `if`). The audit job still covers main on a schedule.
#
# What is left costs ~13 minutes a run, of which ~8.5 is compiling: a fresh
# `actions/checkout` gives every source file a new mtime, so cargo rebuilds all
# 73 workspace + submodule crates each time even though the cached registry
# dependencies are reused. Fixing that needs a content-addressed compiler cache
# (sccache) or `git-restore-mtime` with a full-history checkout; neither is here
# yet, because the budget no longer forces it.
on:
  pull_request:
    branches: [main]
    # `ready_for_review` is here because the test job skips drafts (see its
    # `if` below); without it, marking a draft ready would never start CI.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Weekly advisory sweep of main's Cargo.lock (Monday 09:00 UTC).
    - cron: '0 9 * * 1'
  workflow_dispatch:

# A new push to a PR makes the run in progress obsolete; cancel it instead of
# paying for both. Scheduled and manual runs share no ref with a PR, so they
# are never cancelled by one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is never inspected in CI and roughly triples the size of the
  # target directory; the hosted runners run out of disk without this.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    # Two kinds of run cost ~13 minutes and tell us nothing:
    #
    #   * a draft PR, which is still being pushed to; and
    #   * a `docs:` PR, which by this repo's convention changes Markdown plus
    #     the version line every commit bumps in Cargo.toml and Cargo.lock.
    #     That version bump is why `paths-ignore` cannot express this — a
    #     docs-only PR always touches those two files.
    #
    # `workflow_dispatch` overrides both, so a docs PR can still be built by
    # hand from the Actions tab if one ever does carry code.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && !github.event.pull_request.draft
          && !startsWith(github.event.pull_request.title, 'docs:'))
    runs-on: ubuntu-latest
    # Real PostgreSQL for the database-backed suites (fcp-storage-postgres,
    # fcp-api-core, and the per-binary smoke tests). They create and drop a
    # throwaway database per test, so the service only needs a superuser and
    # the default `postgres` database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis for the fcp-jobs smoke test (crates/fcp-jobs/tests/smoke.rs);
      # everything else treats Redis as optional.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FCP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      FCP_TEST_REDIS_URL: redis://localhost:6379
    steps:
      # The hosted runner leaves ~14GB free, which a 32-crate workspace's
      # debug + test artifacts overflow (the run dies with SIGBUS in ld /
      # "No space left on device"). Drop the large preinstalled toolchains
      # we never use to reclaim ~20GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      # The workspace path-depends on external/siphon-rs and external/forge-media,
      # so the submodules must be present or dependency resolution fails outright.
      # Both submodule repos are public, so the default GITHUB_TOKEN suffices.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # `--all-features` turns on fcp-conference-server's `video-*` features,
      # which link the native video codecs (libvpx, dav1d, OpenH264 built from
      # source, SVT-AV1). forge-media's composite action installs them the way
      # its own CI does.
      - name: Install native video codec libraries
        uses: ./external/forge-media/.github/actions/video-codecs
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
      # `cargo fmt --all` also reformats the path dependencies under external/, which are
      # separately maintained submodules with their own CI. Scope the check to the
      # workspace members so FCP's CI does not police siphon-rs / forge-media style.
      - name: Format
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name | "-p \(.)"' | tr '\n' ' ')
          cargo fmt $pkgs -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # `recording-webm` is off by default (it builds libopus from source),
      # so the conference server's WebM recording test only runs when it is
      # asked for by name.
      - name: Tests
        run: cargo test --all-targets --features fcp-conference-server/recording-webm

  security-audit:
    name: Security Audit
    # Cheap enough (~20s) to keep running on `docs:` PRs, which do change
    # Cargo.lock; drafts are still skipped along with the test job.
    if: >-
      github.event_name != 'pull_request'
      || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # cargo-audit reads the committed Cargo.lock, so this job does not need
      # the submodules.
      - uses: actions/checkout@v5
      # A prebuilt binary: `cargo install` compiled cargo-audit from source on
      # every run, 5.6 of the job's 5.7 minutes, to run a 5-second check.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        run: cargo audit
      - name: Run cargo-audit with JSON output
        if: always()
        run: cargo audit --json > audit-report.json || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json
