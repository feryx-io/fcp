[service]
service_type = "events"
node_id = "events-local"

[auth]
token = "events-local-secret"

[websocket]
bind_address = "0.0.0.0:8081"
heartbeat_interval = 30
client_timeout = 60
max_message_size = 1048576
batch_size = 10
batch_timeout = 100

[event_bus]
bus_type = "in-memory"
buffer_size = 1000

[limits]
max_connections = 1000
max_connections_per_tenant = 50

[webhook]
# Deliver tenants' webhooks (docs/WEBHOOKS.md), read from the admin's database.
enabled = true
database_url = "postgresql://fcp:fcp_password@localhost:5432/fcp"
# Only public HTTPS targets. Set true (here and in the admin's [webhooks])
# to try a receiver on this machine.
allow_private_targets = false

[logging]
level = "info"
format = "pretty"

[cluster]
enabled = true
redis_url = "redis://localhost:6379"
heartbeat_interval_secs = 5
heartbeat_ttl_secs = 15
