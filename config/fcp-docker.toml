# FCP Call Manager Configuration for Docker
# This configuration uses the correct section names for fcp-call-manager

[service]
service_type = "call-manager"
node_id = "cm-docker-01"

[sip]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"

[registrar]
auth_enabled = false
realm = "fcp.local"
default_expires = 3600
min_expires = 60
max_expires = 7200

[storage]
database_url = "postgresql://postgres:password@postgres:5432/fcp"

[media]
rtp_port_start = 10000
rtp_port_end = 11000
codecs = ["PCMU", "PCMA", "G722"]
public_ip = "192.168.1.225"

[http]
bind_address = "0.0.0.0:8084"

[logging]
level = "info"
format = "json"

[calls]
max_concurrent_calls = 100
call_timeout_seconds = 60
enable_sdp = true
enable_refer = true
enable_dtmf = true
enable_transcoding = true
