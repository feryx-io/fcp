[workspace]
members = [
    "crates/fcp-core", "crates/fcp-runtime", "crates/fcp-sip", "crates/fcp-server", "crates/fcp-routing", "crates/fcp-media",
]
exclude = [
    "external/siphon-rs",
    "external/forge-media",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.4"
license = "MIT OR Apache-2.0"
authors = ["FCP Team"]
repository = "https://github.com/thevoiceguy/fcp.git"

[workspace.dependencies]
anyhow = "1"
bcrypt = "0.15"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
