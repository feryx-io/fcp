[workspace]
members = [
    "crates/fcp-core", "crates/fcp-sip", "crates/fcp-routing", "crates/fcp-media", "crates/fcp-cli", "crates/fcp-storage-sqlite", "crates/fcp-storage-postgres", "crates/fcp-storage-mysql", "crates/fcp-storage-mongodb", "crates/fcp-events", "crates/fcp-flow", "crates/fcp-voicemail", "crates/fcp-b2bua-core", "crates/fcp-api-core", "crates/fcp-admin", "crates/fcp-api-gateway", "crates/fcp-events-server", "crates/fcp-jobs", "crates/fcp-registrar", "crates/fcp-call-manager", "crates/fcp-sbc-core", "crates/fcp-sbc", "crates/fcp-ivr", "crates/fcp-voicemail-server", "crates/fcp-pbx", "crates/fcp-conference-server",
]
exclude = [
    "external/siphon-rs",
    "external/forge-media",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.14.40"
license = "MIT OR Apache-2.0"
authors = ["FCP Team"]
repository = "https://github.com/thevoiceguy/fcp.git"

[workspace.dependencies]
anyhow = "1"
bcrypt = "0.15"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
