# cargo-audit configuration for FCP project
# https://rustsec.org/

[advisories]
# Ignore advisories for specific crates (if needed)
# ignore = ["RUSTSEC-0000-0000"]

# Warn about unmaintained crates
unmaintained = "warn"

# Warn about unsound crates
unsound = "warn"

# Deny vulnerabilities with high severity
vulnerability = "deny"

# Warn about yanked crates
yanked = "warn"

[output]
# Output format (terminal, json, etc)
format = "terminal"

# Show all information
quiet = false

# Show affected versions
show-tree = false
