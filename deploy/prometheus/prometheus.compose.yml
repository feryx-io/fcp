# Prometheus configuration for the Docker Compose deployment.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'fcp-monitor'
    environment: 'development'

scrape_configs:
  # fcp-admin runs on the Compose bridge network.
  - job_name: 'fcp-admin'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    static_configs:
      - targets: ['fcp-admin:8080']
        labels:
          service: 'admin'

  # These services run with `network_mode: host`, so Prometheus reaches them
  # through the Docker host gateway from the bridge network.
  - job_name: 'fcp-call-manager'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          service: 'call-manager'

  - job_name: 'fcp-conference'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          service: 'conference'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
