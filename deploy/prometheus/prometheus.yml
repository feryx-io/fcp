# Prometheus configuration for FCP monitoring

global:
  scrape_interval: 15s  # Set the scrape interval to every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'fcp-monitor'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (for alerts)
# rule_files:
#   - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # FCP Server metrics
  - job_name: 'fcp-server'
    static_configs:
      - targets: ['fcp-server:8080']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL exporter (if installed)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Node exporter (system metrics, if installed)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
