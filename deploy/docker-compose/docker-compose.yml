version: '3.8'

services:
  # Redis - Used by both fcp-api-gateway (cache) and fcp-jobs (queue)
  redis:
    image: redis:7-alpine
    container_name: fcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # fcp-admin - Management API (CRUD operations)
  fcp-admin:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.admin
    container_name: fcp-admin
    ports:
      - "8080:8080"
    volumes:
      - ./configs/fcp-admin.toml:/app/fcp-admin.toml:ro
      - fcp_shared-data:/app/data  # Shared with fcp-call-manager
    environment:
      - RUST_LOG=info
      - FCP_ADMIN_LOG_FORMAT=pretty
    depends_on:
      - redis
      - fcp-events-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # fcp-api-gateway - Public-facing gateway with caching and rate limiting
  fcp-api-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.gateway
    container_name: fcp-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./configs/fcp-api-gateway.toml:/app/fcp-api-gateway.toml:ro
    environment:
      - RUST_LOG=info
      - FCP_GATEWAY_LOG_FORMAT=pretty
    depends_on:
      - redis
      - fcp-admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # fcp-events-server - WebSocket event streaming
  fcp-events-server:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.events
    container_name: fcp-events-server
    ports:
      - "8081:8081"
    volumes:
      - ./configs/fcp-events-server.toml:/app/fcp-events-server.toml:ro
    environment:
      - RUST_LOG=info
      - FCP_EVENTS_LOG_FORMAT=pretty
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # fcp-call-manager - Combined SIP registrar and B2BUA call handler
  fcp-call-manager:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.call-manager
    container_name: fcp-call-manager
    # Use host networking for proper UDP/RTP handling
    # Docker bridge networking has issues with UDP port ranges used by RTP
    network_mode: host
    volumes:
      - ./configs/fcp-call-manager.toml:/app/fcp-call-manager.toml:ro
      - ./configs/routing.yaml:/app/routing.yaml:ro
      - ./certs:/app/certs:ro  # TLS certificates for SIPS
      - fcp_shared-data:/app/data  # Shared with main docker-compose
    environment:
      - RUST_LOG=info
      - FCP_CALL_MANAGER_LOG_FORMAT=pretty
      # Set to your Docker host's LAN IP (required for RTP/SDP to work)
      - FCP_CALL_MANAGER_PUBLIC_IP=${HOST_IP:-}
    depends_on:
      fcp-admin:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # fcp-conference - Conference bridge server
  fcp-conference:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.conference
    container_name: fcp-conference
    # Use host networking for proper UDP/RTP handling
    network_mode: host
    volumes:
      - ./configs/fcp-conference-server.toml:/app/fcp-conference-server.toml:ro
      - fcp-recordings:/var/fcp/conference/recordings
      - ./configs/announcements:/var/fcp/conference/announcements:ro
    environment:
      - RUST_LOG=info
      - FCP_CONFERENCE_LOG_FORMAT=pretty
      - FCP_CONFERENCE_PUBLIC_IP=${HOST_IP:-}
    depends_on:
      fcp-admin:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # fcp-media - Standalone media processing server
  fcp-media:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.media
    container_name: fcp-media
    # Use host networking for proper UDP/RTP handling
    network_mode: host
    volumes:
      - ./configs/fcp-media-server.toml:/app/fcp-media-server.toml:ro
      - fcp-media-recordings:/var/lib/fcp/media/recordings
      - fcp-media-prompts:/var/lib/fcp/media/prompts
    environment:
      - RUST_LOG=info
      - FCP_MEDIA_LOG_FORMAT=pretty
      - FCP_MEDIA_PUBLIC_IP=${HOST_IP:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fcp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Grafana - Dashboards and visualization
  grafana:
    image: grafana/grafana:11.1.0
    container_name: fcp-grafana
    ports:
      - "3000:3000"
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # fcp-jobs - Async job processing workers
  fcp-jobs:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.jobs
    container_name: fcp-jobs
    ports:
      - "8082:8082"
    volumes:
      - ./configs/fcp-jobs.toml:/app/fcp-jobs.toml:ro
    environment:
      - RUST_LOG=info
      - FCP_JOBS_LOG_FORMAT=pretty
      - FCP_JOBS_WORKERS=4
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  fcp-recordings:
    driver: local
  fcp-media-recordings:
    driver: local
  fcp-media-prompts:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  fcp_shared-data:
    external: true  # Created by main docker-compose.yml

networks:
  default:
    name: fcp-network
