# The FCP stack on one Docker host (docs/SHIP_AND_OPERATE.md phase 3).
#
#   edit .env (or keep your own copy and pass --env-file)
#   docker compose up -d --build
#   docker compose --profile registrar up -d   # with the standalone registrar
#
# Two kinds of service. The ones that carry SIP and RTP — the call manager,
# the conference server, the media server and the WebRTC gateway — run on
# the host's network, because Docker's bridge cannot forward RTP port
# ranges usefully; they reach the bridge services through the ports those
# publish on the host (127.0.0.1:5432, :6379, :8081), and the bridge
# services reach them through `host.docker.internal`. Everything else runs
# on the bridge network `fcp-network`.
#
# Ports on the host (none collide):
#   5432 postgres · 6379 redis · 8000 gateway · 8080 admin · 8081 events
#   8082 jobs · 8084 call manager · 8085 media · 8086 ivr · 8087 voicemail
#   8090 conference · 8092 presence · 8093 tts (profile) · 8094 sbc health
#   8095 webrtc (HTTPS) · 8185 media HTTPS · 9090 prometheus · 3000 grafana
#   HTTPS through the proxy: 8443 gateway · 8444 admin · 8445 events
#   The link (admin): 8446 enroll · 8447 heartbeats under mutual TLS
#   SIP 5060 call manager · 5070 ivr · 5072 voicemail · 5074 conference
#   5076 presence · 5077 webrtc · 5078 sbc · 5062/8083 registrar (profile)
#   TLS: SIPS 5061 + WSS 5081 call manager · 5075 conference · 5079 sbc
#   5063/5083 registrar (profile)
#   RTP 10000-10999 call manager · 20000-20999 conference · 22000-22999 ivr
#   24000-24999 voicemail · 28000-28999 sbc · 30000-30999 media
#   34000-35999 webrtc
#
# Secrets come from .env through each binary's FCP_* environment override
# (`--check-config` on any binary shows what it will run with, masked).
#
# Every FCP service names both an image and a build: `up -d --build` builds
# it here and tags it `…:local`; `FCP_IMAGE_TAG=nightly docker compose pull`
# fetches what the Images workflow pushed to ghcr.io instead, and
# `up -d --no-build` runs that (docs/NIGHTLY_STACK.md phase 2).

services:
  postgres:
    image: postgres:16-alpine
    container_name: fcp-postgres
    environment:
      POSTGRES_USER: fcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fcp -d fcp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # The management API and the admin UI. Migrations run at its startup
  # (and at every other binary's that opens Postgres).
  # The stack's certificates and master key (docs/PRODUCTION_STACK.md
  # phases 3 and 4): a CA, a certificate per TLS service and master.key,
  # made once into the fcp-certs volume by scripts/make-certs.sh and kept
  # on every later start. Phones and browsers trust ca.crt from that
  # volume (README, "Certificates"); every service that opens Postgres
  # seals its secrets under master.key (README, "Encryption at rest").
  certs:
    image: alpine/openssl:latest
    container_name: fcp-certs
    entrypoint: ["/bin/sh", "/make-certs.sh"]
    environment:
      HOST_IP: ${HOST_IP}
    volumes:
      - ./scripts/make-certs.sh:/make-certs.sh:ro
      - fcp-certs:/certs

  fcp-admin:
    image: ghcr.io/thevoiceguy/fcp-admin:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.admin
    container_name: fcp-admin
    ports:
      - "8080:8080"
      # The link: sites enroll on 8446 (TLS) and heartbeat on 8447 (mutual
      # TLS from the link CA) — docs/HYBRID_CONTROL_PLANE.md.
      - "8446:8446"
      - "8447:8447"
    volumes:
      - ./configs/fcp-admin.toml:/app/fcp-admin.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
      - admin-data:/app/data
    environment:
      RUST_LOG: info
      FCP_ADMIN_LOG_FORMAT: pretty
      HOST_IP: ${HOST_IP}
      FCP_ADMIN_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@postgres:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
      FCP_ADMIN_AUTH_TOKEN: ${FCP_ADMIN_AUTH_TOKEN}
      FCP_ADMIN_PROVISIONING_AUTH_TOKEN: ${FCP_ADMIN_PROVISIONING_AUTH_TOKEN}
      FCP_ADMIN_EVENTS_AUTH_TOKEN: ${FCP_EVENTS_AUTH_TOKEN}
      FCP_ADMIN_CALL_MANAGER_AUTH_TOKEN: ${FCP_CALL_MANAGER_API_TOKEN}
      FCP_ADMIN_CONFERENCE_AUTH_TOKEN: ${FCP_CONFERENCE_AUTH_TOKEN}
      FCP_ADMIN_CONFERENCE_JOIN_SECRET: ${FCP_CONFERENCE_JOIN_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # The public API gateway in front of the admin.
  fcp-api-gateway:
    image: ghcr.io/thevoiceguy/fcp-gateway:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.gateway
    container_name: fcp-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./configs/fcp-api-gateway.toml:/app/fcp-api-gateway.toml:ro
    environment:
      RUST_LOG: info
      FCP_GATEWAY_LOG_FORMAT: pretty
    depends_on:
      redis:
        condition: service_healthy
      fcp-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Event streaming: every other service posts to its /ingest.
  fcp-events-server:
    image: ghcr.io/thevoiceguy/fcp-events:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.events
    container_name: fcp-events-server
    ports:
      - "8081:8081"
    volumes:
      - ./configs/fcp-events-server.toml:/app/fcp-events-server.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
    environment:
      RUST_LOG: info
      FCP_EVENTS_LOG_FORMAT: pretty
      FCP_EVENTS_AUTH_TOKEN: ${FCP_EVENTS_AUTH_TOKEN}
      # Tenants' webhooks are read from Postgres, their secrets sealed at rest.
      FCP_EVENTS_WEBHOOK_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@postgres:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Registrar, B2BUA, routing and PBX features: where phones register and
  # calls are placed. SIP 5060, HTTP 8084, RTP 10000-10999, on the host.
  fcp-call-manager:
    image: ghcr.io/thevoiceguy/fcp-call-manager:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.call-manager
    container_name: fcp-call-manager
    network_mode: host
    volumes:
      - ./configs/fcp-call-manager.toml:/app/fcp-call-manager.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
      - call-manager-data:/app/data
    environment:
      RUST_LOG: info
      FCP_CALL_MANAGER_LOG_FORMAT: pretty
      FCP_CALL_MANAGER_PUBLIC_IP: ${HOST_IP}
      FCP_CALL_MANAGER_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@127.0.0.1:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
      FCP_CALL_MANAGER_API_TOKEN: ${FCP_CALL_MANAGER_API_TOKEN}
      FCP_CALL_MANAGER_EVENTS_AUTH_TOKEN: ${FCP_EVENTS_AUTH_TOKEN}
      FCP_CALL_MANAGER_TTS_REMOTE_TOKEN: ${FCP_TTS_AUTH_TOKENS}
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # The conference bridge. SIP 5074, HTTP 8090, RTP 20000-20999, on the host.
  fcp-conference:
    image: ghcr.io/thevoiceguy/fcp-conference:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.conference
    container_name: fcp-conference
    network_mode: host
    volumes:
      - ./configs/fcp-conference-server.toml:/app/fcp-conference-server.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
      - conference-recordings:/var/fcp/conference/recordings
      - conference-cdr-spool:/var/lib/fcp/cdr-spool
      - ./configs/announcements:/var/fcp/conference/announcements:ro
    environment:
      RUST_LOG: info
      FCP_CONFERENCE_LOG_FORMAT: pretty
      FCP_CONFERENCE_PUBLIC_IP: ${HOST_IP}
      FCP_CONFERENCE_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@127.0.0.1:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
      FCP_CONFERENCE_AUTH_TOKEN: ${FCP_CONFERENCE_AUTH_TOKEN}
      FCP_CONFERENCE_EVENTS_AUTH_TOKEN: ${FCP_EVENTS_AUTH_TOKEN}
      FCP_CONFERENCE_JOIN_SECRET: ${FCP_CONFERENCE_JOIN_SECRET}
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Browsers into conference rooms. HTTP 8095, SIP 5077, RTP 34000-35999,
  # on the host.
  fcp-webrtc-gw:
    image: ghcr.io/thevoiceguy/fcp-webrtc-gw:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.webrtc-gw
    container_name: fcp-webrtc-gw
    network_mode: host
    volumes:
      - ./configs/fcp-webrtc-gw.toml:/app/fcp-webrtc-gw.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
    environment:
      RUST_LOG: info
      FCP_WEBRTC_GW_LOG_FORMAT: pretty
      FCP_WEBRTC_GW_PUBLIC_IP: ${HOST_IP}
      FCP_WEBRTC_GW_AUTH_TOKENS: ${FCP_WEBRTC_GW_AUTH_TOKENS}
    depends_on:
      certs:
        condition: service_completed_successfully
      fcp-conference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # The standalone media server. HTTP 8085, HTTPS 8185, RTP 30000-30999,
  # on the host.
  fcp-media:
    image: ghcr.io/thevoiceguy/fcp-media:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.media
    container_name: fcp-media
    network_mode: host
    volumes:
      - ./configs/fcp-media-server.toml:/app/fcp-media-server.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
      - media-recordings:/var/lib/fcp/media/recordings
      - media-prompts:/var/lib/fcp/media/prompts
    environment:
      RUST_LOG: info
      FCP_MEDIA_LOG_FORMAT: pretty
      FCP_MEDIA_PUBLIC_IP: ${HOST_IP}
      FCP_MEDIA_AUTH_TOKENS: ${FCP_MEDIA_AUTH_TOKENS}
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # The CDR processor and the job workers.
  fcp-jobs:
    image: ghcr.io/thevoiceguy/fcp-jobs:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.jobs
    container_name: fcp-jobs
    ports:
      - "8082:8082"
    volumes:
      - ./configs/fcp-jobs.toml:/app/fcp-jobs.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
    environment:
      RUST_LOG: info
      FCP_JOBS_LOG_FORMAT: pretty
      FCP_JOBS_WORKERS: 4
      FCP_JOBS_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@postgres:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Call flows (IVR). SIP 5070, HTTP 8086, RTP 22000-22999, on the host.
  fcp-ivr:
    image: ghcr.io/thevoiceguy/fcp-ivr:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.ivr
    container_name: fcp-ivr
    network_mode: host
    volumes:
      - ./configs/fcp-ivr.toml:/app/fcp-ivr.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
    environment:
      RUST_LOG: info
      FCP_IVR_LOG_FORMAT: pretty
      FCP_IVR_PUBLIC_IP: ${HOST_IP}
      FCP_IVR_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@127.0.0.1:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
      FCP_IVR_API_TOKEN: ${FCP_IVR_API_TOKEN}
      FCP_IVR_EVENTS_AUTH_TOKEN: ${FCP_EVENTS_AUTH_TOKEN}
      FCP_IVR_TTS_REMOTE_TOKEN: ${FCP_TTS_AUTH_TOKENS}
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Voicemail. SIP 5072, HTTP 8087, RTP 24000-24999, on the host.
  fcp-voicemail:
    image: ghcr.io/thevoiceguy/fcp-voicemail:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.voicemail
    container_name: fcp-voicemail
    network_mode: host
    volumes:
      - ./configs/fcp-voicemail-server.toml:/app/fcp-voicemail-server.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
      - voicemail-data:/var/lib/fcp/voicemail
    environment:
      RUST_LOG: info
      FCP_VOICEMAIL_LOG_FORMAT: pretty
      FCP_VOICEMAIL_PUBLIC_IP: ${HOST_IP}
      FCP_VOICEMAIL_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@127.0.0.1:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
      FCP_VOICEMAIL_API_TOKEN: ${FCP_VOICEMAIL_API_TOKEN}
      FCP_VOICEMAIL_EVENTS_AUTH_TOKEN: ${FCP_EVENTS_AUTH_TOKEN}
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Presence and BLF. SIP 5076, HTTP 8092, on the host.
  fcp-presence:
    image: ghcr.io/thevoiceguy/fcp-presence:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.presence
    container_name: fcp-presence
    network_mode: host
    volumes:
      - ./configs/fcp-presence-server.toml:/app/fcp-presence-server.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
    environment:
      RUST_LOG: info
      FCP_PRESENCE_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@127.0.0.1:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
      FCP_PRESENCE_API_TOKEN: ${FCP_PRESENCE_API_TOKEN}
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # The session border controller, in front of the call manager for
  # carriers. SIP 5078, health 8094, RTP 28000-28999, on the host; its
  # binds are flags, set here.
  fcp-sbc:
    image: ghcr.io/thevoiceguy/fcp-sbc:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.sbc
    container_name: fcp-sbc
    network_mode: host
    volumes:
      - ./configs/fcp-sbc.toml:/app/fcp-sbc.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
    environment:
      RUST_LOG: info
      FCP_SBC_LOG_FORMAT: pretty
      FCP_SBC_BIND: 0.0.0.0:5078
      FCP_SBC_HEALTH_BIND: 0.0.0.0:8094
      FCP_SBC_HEALTH_API_TOKEN: ${FCP_SBC_HEALTH_API_TOKEN}
      FCP_SBC_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@127.0.0.1:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fcp-call-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Text to speech for the call manager and IVR. HTTP 8093. Off unless
  # asked for — `docker compose --profile tts up -d` — because its image
  # carries PyTorch; without it the prompts are silent.
  fcp-tts:
    image: ghcr.io/thevoiceguy/fcp-tts:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.tts
    container_name: fcp-tts
    profiles: ["tts"]
    ports:
      - "8093:8093"
    volumes:
      - ./configs/fcp-tts-server.toml:/app/fcp-tts-server.toml:ro
      - tts-cache:/var/lib/fcp/tts_cache
    environment:
      RUST_LOG: info
      FCP_TTS_LOG_FORMAT: pretty
      FCP_TTS_AUTH_TOKENS: ${FCP_TTS_AUTH_TOKENS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # HTTPS for the services that serve only HTTP: nginx in front of the
  # gateway (8443), the admin (8444) and the events server (8445) with the
  # certs service's certificate, saying so in X-Forwarded-Proto so the
  # admin can require HTTPS for provisioning as it does by default. Plain
  # HTTP stays on their own ports.
  fcp-proxy:
    image: nginx:1.27-alpine
    container_name: fcp-proxy
    ports:
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
    configs:
      - source: proxy_config
        target: /etc/nginx/nginx.conf
    volumes:
      - fcp-certs:/var/lib/fcp/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      fcp-admin:
        condition: service_healthy
      fcp-api-gateway:
        condition: service_healthy
      fcp-events-server:
        condition: service_healthy
    # Through the proxy to the admin's health, by address: in the container
    # `localhost` is ::1 first, so the probe must reach an IPv6 listener or
    # name the IPv4 one — it does both, and the nightly stack proved the
    # old probe never passed (docs/NIGHTLY_STACK.md phase 2).
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8444/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # A standalone registrar, for deployments that keep registration off the
  # call manager (docs/CAPACITY_AND_SURVIVABILITY.md). Off unless asked
  # for: `docker compose --profile registrar up -d`. SIP 5062, HTTP 8083.
  fcp-registrar:
    image: ghcr.io/thevoiceguy/fcp-registrar:${FCP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.registrar
    container_name: fcp-registrar
    profiles: ["registrar"]
    network_mode: host
    volumes:
      - ./configs/fcp-registrar.toml:/app/fcp-registrar.toml:ro
      - fcp-certs:/var/lib/fcp/certs:ro
    environment:
      RUST_LOG: info
      FCP_REGISTRAR_LOG_FORMAT: pretty
      FCP_REGISTRAR_DATABASE_URL: postgresql://fcp:${POSTGRES_PASSWORD}@127.0.0.1:5432/fcp
      FCP_ENCRYPTION_PROVIDER: local
      FCP_MASTER_KEY_FILE: /var/lib/fcp/certs/master.key
      FCP_REGISTRAR_API_TOKEN: ${FCP_REGISTRAR_API_TOKEN}
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Metrics. Every FCP metrics endpoint that wants a token gets the one
  # from .env; the configuration is written from this file so the tokens
  # come from one place.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fcp-prometheus
    ports:
      - "9090:9090"
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fcp-grafana
    ports:
      - "3000:3000"
    volumes:
      - ../grafana/datasources-compose:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

configs:
  # The proxy: one TLS server per HTTP-only service. `$$` is a literal `$`
  # to compose.
  proxy_config:
    content: |
      events {}
      http {
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
        }
        ssl_certificate     /var/lib/fcp/certs/fcp-proxy.crt;
        ssl_certificate_key /var/lib/fcp/certs/fcp-proxy.key;
        proxy_http_version 1.1;
        proxy_set_header Host $$host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;
        proxy_read_timeout 3600s;
        server {
          listen 8443 ssl;
          listen [::]:8443 ssl;
          location / { proxy_pass http://fcp-api-gateway:8000; }
        }
        server {
          listen 8444 ssl;
          listen [::]:8444 ssl;
          location / { proxy_pass http://fcp-admin:8080; }
        }
        server {
          listen 8445 ssl;
          listen [::]:8445 ssl;
          location / { proxy_pass http://fcp-events-server:8081; }
        }
      }
  prometheus:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
        external_labels:
          monitor: fcp
      scrape_configs:
        - job_name: fcp-admin
          metrics_path: /metrics
          authorization:
            type: Bearer
            credentials: ${FCP_ADMIN_AUTH_TOKEN}
          static_configs:
            - targets: ['fcp-admin:8080']
              labels: { service: admin }
        - job_name: fcp-events-server
          metrics_path: /metrics
          static_configs:
            - targets: ['fcp-events-server:8081']
              labels: { service: events }
        - job_name: fcp-jobs
          metrics_path: /metrics
          static_configs:
            - targets: ['fcp-jobs:8082']
              labels: { service: jobs }
        - job_name: fcp-call-manager
          metrics_path: /metrics
          authorization:
            type: Bearer
            credentials: ${FCP_CALL_MANAGER_API_TOKEN}
          static_configs:
            - targets: ['host.docker.internal:8084']
              labels: { service: call-manager }
        - job_name: fcp-conference
          metrics_path: /metrics
          authorization:
            type: Bearer
            credentials: ${FCP_CONFERENCE_AUTH_TOKEN}
          static_configs:
            - targets: ['host.docker.internal:8090']
              labels: { service: conference }
        - job_name: fcp-webrtc-gw
          metrics_path: /metrics/prometheus
          authorization:
            type: Bearer
            credentials: ${FCP_WEBRTC_GW_AUTH_TOKENS}
          static_configs:
            - targets: ['host.docker.internal:8095']
              labels: { service: webrtc-gw }
        - job_name: prometheus
          static_configs:
            - targets: ['prometheus:9090']

volumes:
  postgres-data:
  fcp-certs:
  voicemail-data:
  tts-cache:
  redis-data:
  admin-data:
  call-manager-data:
  conference-recordings:
  conference-cdr-spool:
  media-recordings:
  media-prompts:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: fcp-network
