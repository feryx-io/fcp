# fcp-backup in the compose stack (docs/SCHEDULED_BACKUPS.md). Destinations,
# schedules and retention are set on the admin's System › Backups page; this
# names what is backed up and where it is mounted. The database URL comes
# from FCP_BACKUP_DATABASE_URL.

[service]
node_id = "backup-1"

[http]
bind_address = "0.0.0.0:8096"
# The admin's bearer token for snapshots and downloads: FCP_BACKUP_API_TOKEN.

[storage]
database_url = "postgresql://fcp:change-me@postgres:5432/fcp"

[backup]
restic = "/usr/local/bin/restic"
rclone = "/usr/local/bin/rclone"
pg_dump = "/usr/lib/postgresql/16/bin/pg_dump"
work_dir = "/var/lib/fcp-backup"
poll_secs = 30
# Left out of the certs volume's snapshot unless a destination asks for the
# key.
key_ring = "/var/lib/fcp/certs/master.key"

# Each stateful volume, mounted read-only (docs/BACKUP_AND_RESTORE.md §1),
# by its compose name: a download names its tars so, as backup.sh does.
[backup.paths]
fcp-certs = "/var/lib/fcp/certs"
call-manager-data = "/data/call-manager"
admin-data = "/data/admin"
voicemail-data = "/data/voicemail"
conference-recordings = "/data/conference-recordings"
conference-cdr-spool = "/data/conference-cdr-spool"
media-recordings = "/data/media-recordings"
media-prompts = "/data/media-prompts"

# Where each service's files are here: a row names a file by the path its
# service wrote, and a tenant's lost files are found and put back through
# this (docs/SCHEDULED_BACKUPS.md B3b).
[backup.service_paths]
"/app/data/recordings" = "/data/call-manager/recordings"
"/app/data/prompts" = "/data/call-manager/prompts"
"/var/lib/fcp/voicemail" = "/data/voicemail"
"/var/fcp/conference/recordings" = "/data/conference-recordings"
"/var/lib/fcp/media/recordings" = "/data/media-recordings"
"/var/lib/fcp/media/prompts" = "/data/media-prompts"

# The whole system restored from the admin (docs/SCHEDULED_BACKUPS.md B3c),
# only with restores switched on (docker-compose.restore.yml: the Docker
# socket). Every other service but these is drained for up to drain_secs
# and stopped; the database is restored beside the old one and swapped in.
[restore]
pg_restore = "/usr/lib/postgresql/16/bin/pg_restore"
drain_secs = 60
keep_running = ["postgres", "redis", "fcp-backup", "certs"]

[events]
server_url = "http://fcp-events-server:8081"

[cluster]
redis_url = "redis://redis:6379"

[logging]
level = "info"
format = "compact"
