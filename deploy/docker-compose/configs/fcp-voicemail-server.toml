# fcp-voicemail in the compose stack, on the host's network: SIP 5072,
# HTTP 8087, RTP 24000-24999. Secrets come from .env through the
# FCP_VOICEMAIL_* environment overrides.

[service]
service_type = "voicemail"
node_id = "voicemail-docker-01"

[sip]
# Siblings on this host reach each other over loopback; they carry many
# parties' traffic, so the per-source message limit
# (max_messages_per_source, default 200 a second) does not apply to them.
trusted_sources = ["127.0.0.0/8"]
udp_bind = "0.0.0.0:5072"
tcp_bind = "0.0.0.0:5072"

[storage]
# Overridden by FCP_VOICEMAIL_DATABASE_URL.
database_url = "postgresql://fcp:change-me@127.0.0.1:5432/fcp"
redis_url = "redis://127.0.0.1:6379"

[http]
bind_address = "0.0.0.0:8087"
# api_token: FCP_VOICEMAIL_API_TOKEN, required on a non-loopback bind.

[media]
rtp_port_start = 24000
rtp_port_end = 24999

[events]
server_url = "http://127.0.0.1:8081/ingest"

[voicemail]
recordings_dir = "/var/lib/fcp/voicemail/recordings"
greetings_dir = "/var/lib/fcp/voicemail/greetings"
max_message_duration = 300
max_messages_per_mailbox = 100
play_beep = true
# A mailbox with no greeting of its own: the image's, spoken by Piper.
default_greeting_path = "/var/fcp/audio/default-greeting.wav"

[logging]
level = "info"
format = "pretty"
