# fcp-jobs in the compose stack: the job workers and the CDR processor,
# which stores what the call manager and conference server ship to the
# Redis stream (docs/CDR_PIPELINE.md). FCP_JOBS_DATABASE_URL comes from .env.

[service]
service_type = "jobs"
node_id = "jobs-docker-01"

[redis]
url = "redis://redis:6379"
pool_size = 20
connection_timeout = 5
queue_prefix = "fcp:jobs"

[workers]
count = 4
poll_interval = 5
job_timeout = 300
shutdown_timeout = 30

[retry]
max_retries = 5
initial_delay = 10
max_delay = 3600
backoff_multiplier = 2.0

[cdr]
enabled = true
# Stored records stay in the Redis stream this long for replay, about
# 1.1 KB of Redis memory each (docs/CDR_PIPELINE.md §4.2).
# retain_hours = 24
# Overridden by FCP_JOBS_DATABASE_URL.
database_url = "postgresql://fcp:change-me@postgres:5432/fcp"

[health]
enabled = true
bind_address = "0.0.0.0:8082"

[logging]
level = "info"
format = "pretty"
