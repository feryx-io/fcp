# fcp-jobs configuration for Docker Compose

[service]
service_type = "jobs"
node_id = "jobs-docker-01"

[redis]
url = "redis://redis:6379"
pool_size = 20
connection_timeout = 5
queue_prefix = "fcp:jobs"

[workers]
count = 4
poll_interval = 5
job_timeout = 300
shutdown_timeout = 30

[retry]
max_retries = 5
initial_delay = 10
max_delay = 3600
backoff_multiplier = 2.0

[health]
enabled = true
bind_address = "0.0.0.0:8082"

# The CDR archive (docs/CDR_PIPELINE.md §13, phase 5): each tenant's closed
# days of records as gzipped JSON Lines in a bucket. Off unless enabled.
# [cdr_archive]
# enabled = true
# database_url = "postgresql://postgres:password@postgres:5432/fcp"
# prefix = "cdrs/"
# object_lock = false          # lock days a legal hold covers (bucket needs Object Lock)
# target = "s3"
#
# [cdr_archive.s3]
# bucket = "example-cdr-archive"
# region = "us-east-1"
# # endpoint = "http://minio:9000"   # a self-hosted store
# # path_style = true
# # Credentials from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY when unset.

[logging]
level = "info"
format = "pretty"
