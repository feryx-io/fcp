# fcp-events-server in the compose stack. FCP_EVENTS_AUTH_TOKEN, from
# .env, is what every producer posts with and every client connects with.

[service]
service_type = "events"
node_id = "events-docker-01"

[websocket]
bind_address = "0.0.0.0:8081"
heartbeat_interval = 30
client_timeout = 60
max_message_size = 1048576
batch_size = 10
batch_timeout = 100

# Redis: what the voicemail, IVR and conference servers post to /ingest is
# written to the stream and published, so the call manager hears it too —
# a message left lights the phone's lamp (docs/DEEP_TESTING.md D8).
[event_bus]
bus_type = "redis"
redis_url = "redis://redis:6379"
buffer_size = 1000

[limits]
max_connections = 1000
max_connections_per_tenant = 50

[webhook]
# Deliver every tenant's events to the webhooks it manages on the admin API
# (/api/v1/webhooks). The database URL comes from
# FCP_EVENTS_WEBHOOK_DATABASE_URL; only public HTTPS targets are reached.
enabled = true

# On-site notification of emergency calls (docs/E911.md): a tenant's and a
# site's contacts are told. A call contact is rung by the call manager,
# which speaks the notice and, for a contact who may listen in, offers to
# join them to the call. Its token is FCP_EVENTS_NOTIFY_CALL_TOKEN, the
# call manager's FCP_CALL_MANAGER_API_TOKEN. Email and SMS need
# [notifications.smtp] and [notifications.sms] with a provider's account.
[notifications]
enabled = true

[notifications.call]
call_manager_url = "http://host.docker.internal:8084"
ring_timeout_secs = 30
repeat = 2

[logging]
level = "info"
format = "pretty"
