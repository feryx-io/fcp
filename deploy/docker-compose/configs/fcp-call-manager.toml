# fcp-call-manager in the compose stack, on the host's network. Secrets
# come from .env through the FCP_CALL_MANAGER_* environment overrides; the
# host's address through FCP_CALL_MANAGER_PUBLIC_IP.

[service]
service_type = "call-manager"
node_id = "cm-docker-01"

[sip]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"
# SIPS and WSS, from the certificate the `certs` service made for this
# service (docs/PRODUCTION_STACK.md phase 3). Phones trust the CA beside it.
sips_bind = "0.0.0.0:5061"
wss_bind = "0.0.0.0:5081"
tls_cert_path = "/var/lib/fcp/certs/fcp-call-manager.crt"
tls_key_path = "/var/lib/fcp/certs/fcp-call-manager.key"

[security]
max_invite_cps_per_source = 20

[registrar]
auth_enabled = true     # Required on a public SIP bind; users come from the admin API
auth_invites = false
realm = "fcp.local"
default_expires = 3600
min_expires = 60
max_expires = 86400
# Phones register with the realm's domain; add the host's address here if
# yours register with the IP.
domain_aliases = ["fcp.local"]

[calls]
call_timeout_seconds = 60
enable_sdp = true
enable_refer = true

[admission]
max_concurrent_calls = 100

[media]
rtp_port_start = 10000
rtp_port_end = 10999
codecs = ["PCMU", "PCMA", "G722"]
# Everything this node writes to disk lives under /app/data, the
# call-manager-data volume (docs/BACKUP_AND_RESTORE.md): without these the
# defaults are the container's own filesystem (./recordings, /tmp/fcp).
recording_dir = "/app/data/recordings"
prompts_dir = "/app/data/prompts"
tts_cache_dir = "/app/data/tts-cache"
# Speech from the TTS server, when the `tts` profile is up;
# FCP_CALL_MANAGER_TTS_REMOTE_TOKEN authenticates.
tts_remote_url = "http://127.0.0.1:8093"

[storage]
# Overridden by FCP_CALL_MANAGER_DATABASE_URL; Postgres and Redis publish
# their ports on the host, which this container shares.
database_url = "postgresql://fcp:change-me@127.0.0.1:5432/fcp"
redis_url = "redis://127.0.0.1:6379"

[cluster]
# One node is a cluster of one: it heartbeats into Redis, so the admin's
# cluster page lists it with its version, and a second call manager on
# the same Redis joins (docs/CLUSTER_OPERATIONS_RUNBOOK.md).
enabled = true

[cdr]
spool_dir = "/app/data/cdr-spool"
# Records go to the Redis stream and fcp-jobs stores them (docs/CDR_PIPELINE.md).
sink = "stream"

[http]
bind_address = "0.0.0.0:8084"
# api_token: FCP_CALL_MANAGER_API_TOKEN, required on a non-loopback bind.

[b2bua]
# Where calls into a conference room go: the conference server on this host.
conference_server_uri = "sip:conference@127.0.0.1:5074"
# And unanswered calls, to voicemail.
voicemail_server_uri = "sip:voicemail@127.0.0.1:5072"

# No [routing] rules file: the YAML routing store knows only the users the
# file lists and refuses every other caller, and the tenants' routing
# rules live in the database (docs/TENANT_TRUNKS.md §12).

[events]
# The events server publishes 8081 on the host; FCP_CALL_MANAGER_EVENTS_AUTH_TOKEN authenticates.
server_url = "http://127.0.0.1:8081/ingest"

[logging]
level = "info"
format = "pretty"
