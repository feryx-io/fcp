[service]
service_type = "call-manager"
node_id = "cm-docker-01"

[sip]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"
sips_bind = "0.0.0.0:5061"
tls_cert_path = "/app/certs/server.crt"
tls_key_path = "/app/certs/server.key"

[registrar]
auth_enabled = true     # Enabled - users created via fcp-admin API can register
realm = "fcp.local"
default_expires = 3600
min_expires = 60
max_expires = 86400
# Domain aliases - these domains are treated as equivalent for registration lookups.
# Calls to alice@192.168.1.225 will also ring alice@fcp.local and vice versa.
domain_aliases = ["fcp.local", "192.168.1.225"]

[calls]
max_concurrent_calls = 100
call_timeout_seconds = 60
enable_sdp = true
enable_refer = true

[media]
rtp_port_start = 10000
rtp_port_end = 10100
codecs = ["PCMU", "PCMA", "G722"]
public_ip = "192.168.1.225"
enable_transcoding = true
enable_dtmf = true

[storage]
backend = "sqlite"
connection_string = "sqlite:///app/data/fcp.db"

# Alternative backends (uncomment to use):
# backend = "postgres"
# connection_string = "postgresql://fcp:password@postgres:5432/fcp"
# max_connections = 20

# backend = "mysql"
# connection_string = "mysql://fcp:password@mysql:3306/fcp"
# max_connections = 20

# backend = "mongodb"
# connection_string = "mongodb://fcp:password@mongo:27017/fcp"

[http]
bind_address = "0.0.0.0:8084"

[logging]
level = "info"
format = "pretty"

# Routing configuration - call authorization policies
# With `all_users: true` in routing.yaml, any authenticated caller can make calls.
[routing]
rules_file = "/app/routing.yaml"
hot_reload = true

[events]
# Using localhost since call-manager uses host networking
server_url = "http://localhost:8081/ingest"
