# fcp-conference on a node with an NVIDIA GPU (docs/GPU.md), for the
# docker-compose.gpu.yml overlay: the base configuration plus the device.

[service]
service_type = "conference"
node_id = "conference-docker-01"

[sip]
udp_bind = "0.0.0.0:5074"
tcp_bind = "0.0.0.0:5074"
# The call manager on this host names the record each leg belongs to
# (docs/EDGE_SECURITY.md §2.3); its INVITEs come from the loopback.
trusted_edges = ["127.0.0.1"]

[storage]
# Overridden by FCP_CONFERENCE_DATABASE_URL.
database_url = "postgresql://fcp:change-me@127.0.0.1:5432/fcp"
redis_url = "redis://127.0.0.1:6379"

[cdr]
spool_dir = "/var/lib/fcp/cdr-spool"
sink = "stream"

[http]
bind_address = "0.0.0.0:8090"
# A non-loopback bind needs auth_enabled and a token: FCP_CONFERENCE_AUTH_TOKEN.
auth_enabled = true

[media]
rtp_port_start = 20000
rtp_port_end = 20999
codecs = ["PCMU", "PCMA", "G722"]

[conference]
video_device = "cuda:0"
sample_rate = 8000
frame_size = 160
enable_vad = true
auto_destroy_empty_rooms = true
recordings_dir = "/var/fcp/conference/recordings"
recording_format = "auto"
announcements_dir = "/var/fcp/conference/announcements"
jitter_buffer_ms = 40
dtmf_enabled = true
max_pin_attempts = 3
pin_timeout_secs = 10
cache_ttl_secs = 60
# join_secret: FCP_CONFERENCE_JOIN_SECRET, shared with the admin that mints join tokens.

[ai]
enabled = false

[events]
# The events server publishes 8081 on the host; FCP_CONFERENCE_EVENTS_AUTH_TOKEN authenticates.
server_url = "http://127.0.0.1:8081/ingest"

[logging]
level = "info"
format = "pretty"
