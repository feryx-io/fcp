# fcp-media in the compose stack, on the host's network: HTTP 8085,
# RTP 30000-30999. Tokens come from .env through FCP_MEDIA_AUTH_TOKENS.

[service]
service_type = "media"
node_id = "media-docker-01"
shutdown_timeout_secs = 30

[http]
bind_address = "0.0.0.0:8085"

[media]
rtp_port_start = 30000
rtp_port_end = 30999

[recording]
base_dir = "/var/lib/fcp/media/recordings"
root_jail = "/var/lib/fcp/media"
prompts_dir = "/var/lib/fcp/media/prompts"

[tls]
# HTTPS on 8185 beside HTTP on 8085, from the `certs` service's certificate.
enabled = true
bind = "0.0.0.0:8185"
cert = "/var/lib/fcp/certs/fcp-media.crt"
key = "/var/lib/fcp/certs/fcp-media.key"

[auth]
# tokens: FCP_MEDIA_AUTH_TOKENS (required; the server refuses to start without one).
tokens = ["set-by-FCP_MEDIA_AUTH_TOKENS"]

[storage]
# The service beacon (docs/SERVICES.md): the admin's Services page lists
# this node from it. Host networking reaches Redis on the host.
redis_url = "redis://127.0.0.1:6379"

[logging]
level = "info"
format = "json"
