# fcp-webrtc-gw in the compose stack, on the host's network: HTTP 8095,
# SIP 5077, RTP 34000-35999. Tokens come from .env through
# FCP_WEBRTC_GW_AUTH_TOKENS; the host's address through FCP_WEBRTC_GW_PUBLIC_IP.

[service]
service_type = "webrtc-gateway"
node_id = "webrtc-gw-docker-01"

[http]
bind_address = "0.0.0.0:8095"
enable_cors = true
allowed_origins = ["http://localhost:8080"]
serve_join_page = true
public_join = true

[sip]
udp_bind = "0.0.0.0:5077"

[media]
rtp_port_start = 34000
rtp_port_end = 35999

[webrtc]
stun_servers = ["stun:stun.l.google.com:19302"]

[conference]
# The conference server on this host.
server_uri = "sip:conference@127.0.0.1:5074"
node_capacity = 100
srtp = true

[auth]
# tokens: FCP_WEBRTC_GW_AUTH_TOKENS.
tokens = ["set-by-FCP_WEBRTC_GW_AUTH_TOKENS"]

[storage]
redis_url = "redis://127.0.0.1:6379"

[cluster]
enabled = false

[logging]
level = "info"
format = "json"
