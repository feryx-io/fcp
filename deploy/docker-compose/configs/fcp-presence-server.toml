# fcp-presence in the compose stack, on the host's network: SIP 5076,
# HTTP 8092. Secrets come from .env through the FCP_PRESENCE_* overrides.

[service]
service_type = "presence"
node_id = "presence-docker-01"
shutdown_timeout_secs = 10

[sip]
# Siblings on this host reach each other over loopback; they carry many
# parties' traffic, so the per-source message limit
# (max_messages_per_source, default 200 a second) does not apply to them,
# nor does blocking a source that keeps failing authentication
# (max_auth_failures_per_source, default 20 a minute, docs/EDGE_SECURITY.md §2.8).
trusted_sources = ["127.0.0.0/8"]
udp_bind = "0.0.0.0:5076"
tcp_bind = "0.0.0.0:5076"

[storage]
# Overridden by FCP_PRESENCE_DATABASE_URL.
database_url = "postgresql://fcp:change-me@127.0.0.1:5432/fcp"
max_connections = 10
redis_url = "redis://127.0.0.1:6379"

[presence]
max_presentities = 10000
default_subscription_expiry_secs = 3600
cleanup_interval_secs = 60

[http]
bind_address = "0.0.0.0:8092"
# api_token: FCP_PRESENCE_API_TOKEN, required on a non-loopback bind.

[logging]
level = "info"
format = "pretty"
