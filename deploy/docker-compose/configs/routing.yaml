# FCP Routing Rules
#
# This file defines users and policies for the routing/authorization layer.
# To use routing, enable it in fcp-call-manager.toml:
#   [routing]
#   rules_file = "/app/routing.yaml"
#   hot_reload = true
#
# With `all_users: true` in a policy, any authenticated caller (registered via
# fcp-admin API) can make calls without needing to be listed here.

# Define users who can make calls (for role/group-based policies)
# When using `all_users: true`, users here are optional.
users: []

# Define policies for call authorization
# Rules are evaluated in priority order (lower number = higher priority).
# First matching rule determines outcome. Default is DENY if no rule matches.
policies:
  # Allow all authenticated users to make local calls
  - name: allow-all-local-calls
    tenant_id: "00000000-0000-0000-0000-000000000000"
    priority: 100
    enabled: true
    applies_to:
      all_users: true  # Match any authenticated caller
    destination_match:
      pattern: "^sip:.+@fcp\\.local$"  # Match calls to fcp.local domain
    time_windows: []
    source_ip_ranges: []
    action: Allow
    reason: "Allow all authenticated users to call local extensions"

  # Example: Role-based policy (uncomment if using roles from routing.yaml users)
  # - name: allow-employee-calls
  #   tenant_id: "00000000-0000-0000-0000-000000000000"
  #   priority: 200
  #   enabled: true
  #   applies_to:
  #     roles: ["employee"]
  #   destination_match:
  #     pattern: "^sip:\\+?[0-9]+@"  # Match PSTN numbers
  #   time_windows: []
  #   source_ip_ranges: []
  #   action: Allow
  #   reason: "Employees can make external calls"
