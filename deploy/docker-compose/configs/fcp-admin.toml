# fcp-admin in the compose stack. Secrets come from .env through the
# FCP_ADMIN_* environment overrides; nothing secret is written here.

# The voicemail server's volume (voicemail-data, mounted here): greetings
# uploaded, spoken and personalized here are the ones callers hear, and
# messages are played from it.
voicemail_greetings_dir = "/var/lib/fcp/voicemail/greetings"
voicemail_recordings_dir = "/var/lib/fcp/voicemail/recordings"

[service]
service_type = "admin"
node_id = "admin-docker-01"

[api]
bind_address = "0.0.0.0:8080"
# A non-loopback bind needs auth_enabled and a token: FCP_ADMIN_AUTH_TOKEN
# comes from .env.
auth_enabled = true
# provisioning_require_https stays at its default, true: provisioning is
# served through the proxy on 8444, which says so in X-Forwarded-Proto.

[api.provisioning]
# What provisioned phones are told: register at the host's address (the
# registrar knows an address's phones by their username; a name needs the
# tenant to claim it, docs/SINGLE-NODE-SETUP.md §9) and fetch from the
# proxy. HOST_IP is resolved from the environment when this file loads.
sip_server = "${HOST_IP}"
public_url = "https://${HOST_IP}:8444"

[api.firmware]
# Firmware images the platform administrator uploads (docs/PROVISIONING.md
# §11), in admin-data with the rest of the admin's files.
directory = "/app/data/firmware"

[api.captures]
# Captures apps upload when a tenant and an administrator allow them
# (docs/CALL_DIAGNOSTICS.md §3), in admin-data, removed when they expire.
directory = "/app/data/captures"

[sip]
# The realm digest hashes are computed in: the call manager's and the
# registrar's [registrar] realm, which must say the same.
realm = "fcp.local"

[storage]
# Overridden by FCP_ADMIN_DATABASE_URL (the password is in .env).
database_url = "postgresql://fcp:change-me@postgres:5432/fcp"

[cluster]
# The Redis the nodes heartbeat into: the cluster page lists every node
# with its version, and says when they run more than one release
# (docs/BACKUP_AND_RESTORE.md §5).
redis_url = "redis://redis:6379"

[link]
# What a tenant's sites enroll to and heartbeat at (docs/HYBRID_CONTROL_PLANE.md):
# 8446 over TLS for the one-time enrollment, 8447 under mutual TLS from the
# link CA this process makes into admin-data on first start. The listeners'
# own certificate is the certs service's.
enabled = true
enroll_bind = "0.0.0.0:8446"
bind = "0.0.0.0:8447"
cert = "/var/lib/fcp/certs/fcp-admin.crt"
key = "/var/lib/fcp/certs/fcp-admin.key"
ca_dir = "/app/data/link-ca"
# Where a site's calls reach this cloud: the SBC's SIP-over-TLS listener on
# the host's address, which a site's call manager registers its link trunk
# to (docs/HYBRID_CONTROL_PLANE.md §3.6). The SBC challenges with its
# external_domain, which sip_realm must equal.
sip_host = "${HOST_IP}:5079"
sip_realm = "fcp.local"

[events]
# The events server on the bridge network; FCP_ADMIN_EVENTS_AUTH_TOKEN authenticates.
server_url = "http://fcp-events-server:8081/ingest"

[call_manager]
# The call manager runs on the host's network; FCP_ADMIN_CALL_MANAGER_AUTH_TOKEN authenticates.
url = "http://host.docker.internal:8084"

[conference]
# The conference server, on the host's network; FCP_ADMIN_CONFERENCE_AUTH_TOKEN
# and FCP_ADMIN_CONFERENCE_JOIN_SECRET come from .env. gateway_url is where
# browsers are sent to join: the WebRTC gateway on the host's address,
# over HTTPS; HOST_IP is resolved from the environment when this file loads.
server_url = "http://host.docker.internal:8090"
gateway_url = "https://${HOST_IP}:8095"

[backup]
# fcp-backup's API, for a destination's snapshots and their downloads
# (docs/SCHEDULED_BACKUPS.md); FCP_ADMIN_BACKUP_TOKEN authenticates.
url = "http://fcp-backup:8096"

[tts]
# The TTS server on the host's network: prompts are spoken and previewed in
# the voices calls hear. FCP_ADMIN_TTS_AUTH_TOKEN authenticates.
remote_url = "http://host.docker.internal:8093"

[compliance]
exports_dir = "/app/data/exports"

[logging]
level = "info"
format = "pretty"
