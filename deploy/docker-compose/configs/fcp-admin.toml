# fcp-admin configuration for Docker Compose

[service]
service_type = "admin"
node_id = "admin-docker-01"

[api]
bind_address = "0.0.0.0:8080"
auth_enabled = false  # Disabled for testing
cors_enabled = true

[storage]
database_url = "postgresql://postgres:password@postgres:5432/fcp"

[logging]
level = "info"
format = "pretty"

[events]
server_url = "http://fcp-events-server:8081/ingest"
