# fcp-registrar in the compose stack (the `registrar` profile), on the
# host's network: SIP 5062, HTTP 8083. Secrets come from .env through the
# FCP_REGISTRAR_* environment overrides.

[service]
service_type = "registrar"
node_id = "registrar-docker-01"

[sip]
udp_bind = "0.0.0.0:5062"
tcp_bind = "0.0.0.0:5062"
# SIPS and WSS, from the `certs` service's certificate for this service.
sips_bind = "0.0.0.0:5063"
wss_bind = "0.0.0.0:5083"
tls_cert_path = "/var/lib/fcp/certs/fcp-registrar.crt"
tls_key_path = "/var/lib/fcp/certs/fcp-registrar.key"

[registrar]
auth_enabled = true
realm = "fcp.local"
default_expires = 3600
min_expires = 60
max_expires = 86400

[storage]
# Overridden by FCP_REGISTRAR_DATABASE_URL.
database_url = "postgresql://fcp:change-me@127.0.0.1:5432/fcp"

[http]
bind_address = "0.0.0.0:8083"
# api_token: FCP_REGISTRAR_API_TOKEN, required on a non-loopback bind.

[logging]
level = "info"
format = "pretty"
