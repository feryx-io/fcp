[service]
service_type = "registrar"
node_id = "registrar-docker-01"

[sip]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"

[registrar]
auth_enabled = false    # Disabled for testing; enable in production
realm = "fcp.local"
default_expires = 3600
min_expires = 60
max_expires = 86400

[storage]
backend = "sqlite"
connection_string = "sqlite:///app/data/fcp.db"

# Alternative backends (uncomment to use):
# backend = "postgres"
# connection_string = "postgresql://fcp:password@postgres:5432/fcp"
# max_connections = 20

# backend = "mysql"
# connection_string = "mysql://fcp:password@mysql:3306/fcp"
# max_connections = 20

# backend = "mongodb"
# connection_string = "mongodb://fcp:password@mongo:27017/fcp"

[http]
bind_address = "0.0.0.0:8083"

[logging]
level = "info"
format = "pretty"
