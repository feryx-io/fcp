[service]
service_type = "registrar"
node_id = "registrar-docker-01"

[sip]
udp_bind = "0.0.0.0:5060"
tcp_bind = "0.0.0.0:5060"

[registrar]
# A non-loopback SIP bind is refused without authentication.
auth_enabled = true
realm = "fcp.local"
default_expires = 3600
min_expires = 60
max_expires = 86400

[storage]
database_url = "postgresql://postgres:password@postgres:5432/fcp"

[http]
bind_address = "0.0.0.0:8083"
# /status and /drain need this bearer token; a non-loopback bind requires it.
api_token = "change-me-in-production"

[logging]
level = "info"
format = "pretty"
