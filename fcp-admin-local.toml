# Top-level keys come before any section.
prompts_dir = "/tmp/fcp/audio/prompts"

[service]
service_type = "admin"
node_id = "admin-local"

[api]
bind_address = "0.0.0.0:8080"
auth_enabled = true
auth_token = "fcp-local-dev-token-2026"
provisioning_auth_token = "fcp-local-provisioning-token-2026"
provisioning_require_https = false

[storage]
database_url = "postgresql://fcp:fcp_password@localhost:5432/fcp"
max_connections = 10

[events]
server_url = "http://localhost:8081/ingest"
auth_token = "events-local-secret"

[logging]
level = "info"
format = "pretty"

[tts]
engine = "kokoro"
python_path = ".venv/bin/python3"
cache_dir = "/tmp/fcp/tts_cache"
voice = "af_heart"

[cluster]
redis_url = "redis://localhost:6379"
key_prefix = "fcp:"

[conference]
# Live room controls go through this conference server.
server_url = "http://localhost:8090"
auth_token = "svc-local-secret"
# Browser join tokens: the same secret on every conference server
# (conference.join_secret), and the WebRTC gateway the join links open.
join_secret = "join-local-secret"
gateway_url = "http://192.168.1.225:8095"
